<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>RPG Maker MZ 行走图生成器</title>
<style>
:root{
  --paper:#f5f1e8; --paper-2:#fffdf8; --ink:#2b2723; --ink-2:#5f574e; --ink-3:#8d8275;
  --line:#ded6c8; --line-2:#c9bfaf; --accent:#c64b32; --accent-2:#a93c27; --accent-soft:#f7e3da;
  --ok:#2f8a5b; --warn:#b87916; --danger:#b83b32; --fill:#ece5d9; --fill-2:#f7f2e9;
  --shadow:0 14px 34px -18px rgba(48,38,28,.36); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
[hidden]{display:none!important}

.app-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(245,241,232,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 18px -10px var(--accent);flex:none}
.brand h1{font-size:17px;margin:0;line-height:1.2}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--line-2);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 14px -8px var(--accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.sm{min-height:28px;padding:0 9px;font-size:11px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.layout{display:grid;grid-template-columns:348px minmax(0,1fr);gap:16px;padding:16px 18px 32px;max-width:1440px;margin:0 auto;align-items:start}
.side,.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.card h2 .n{width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}

.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--fill);padding:3px;border-radius:10px;margin-bottom:10px}
.tab{min-height:30px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-2);padding:0 6px}
.tab.on{background:var(--paper-2);color:var(--accent);box-shadow:0 2px 6px -2px rgba(0,0,0,.12)}

.field{display:flex;flex-direction:column;gap:4px;margin-top:9px;min-width:0}
.field>span{font-size:11px;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.field input,.field textarea,.field select{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:7px 9px;font-size:12px;outline:none}
.field textarea{resize:vertical;line-height:1.5;min-height:52px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(198,75,50,.1)}
.field input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.field-row .field{margin-top:0}
.check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}

.upload-box{position:relative;display:flex;align-items:center;gap:10px;min-height:72px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:11px;background:var(--fill-2);cursor:pointer;overflow:hidden}
.upload-box:hover{border-color:var(--accent);background:var(--accent-soft)}
.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-thumb{width:54px;height:54px;border-radius:8px;border:1px solid var(--line);background:#fff;object-fit:contain;flex:none;image-rendering:pixelated}
.upload-meta{min-width:0;flex:1}
.upload-meta strong{display:block;font-size:12px;color:var(--ink)}
.upload-meta span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-clear{position:relative;z-index:2}

.body-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:2px}
.body-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 3px 6px;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);color:var(--ink-2);text-align:center;min-width:0;transition:border-color .15s,background .15s,box-shadow .15s;-webkit-user-select:none;user-select:none}
.body-card:hover{border-color:var(--accent);color:var(--ink)}
.body-card.selected{border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);padding:4px 2px 5px;box-shadow:0 0 0 2px rgba(198,75,50,.14)}
.body-card.action{border-style:dashed;background:var(--fill-2)}
.body-thumb{width:48px;height:48px;border-radius:6px;border:1px solid var(--line);background-color:#fff;background-image:linear-gradient(45deg,#f0ece3 25%,transparent 25%,transparent 75%,#f0ece3 75%),linear-gradient(45deg,#f0ece3 25%,transparent 25%,transparent 75%,#f0ece3 75%);background-size:8px 8px;background-position:0 0,4px 4px;display:grid;place-items:center;overflow:hidden;flex:none}
.body-thumb img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.body-thumb.icon{background:var(--fill-2);color:var(--ink-3);font-size:18px;font-weight:700;line-height:1}
.body-name{font-size:10px;font-weight:600;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.body-swap{position:absolute;top:2px;right:2px;min-width:20px;height:18px;padding:0 4px;border-radius:5px;border:1px solid var(--line-2);background:rgba(255,253,248,.94);color:var(--ink-2);font-size:9px;font-weight:700;line-height:16px;display:grid;place-items:center}
.body-swap:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.body-popover{position:fixed;z-index:80;pointer-events:none;background:var(--paper-2);border:1px solid var(--line-2);border-radius:12px;padding:8px;box-shadow:0 18px 40px -16px rgba(35,28,22,.45);display:flex;flex-direction:column;align-items:center;gap:5px}
.body-popover img{width:144px;height:192px;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line);background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.body-popover span{font-size:11px;font-weight:600;color:var(--ink)}
.body-credits{margin-top:6px;font-size:11px;color:var(--ink-3)}
.body-credits summary{cursor:pointer;user-select:none;color:var(--ink-2);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:4px}
.body-credits summary::-webkit-details-marker{display:none}
.body-credits summary::before{content:'▸';font-size:10px;transition:transform .15s}
.body-credits[open] summary::before{transform:rotate(90deg)}
.body-credit-list{margin:6px 0 0;padding:8px 10px;list-style:none;background:var(--fill-2);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;gap:5px}
.body-credit-list li{line-height:1.45;word-break:break-word}
.body-credit-list a{color:var(--accent);text-decoration:none}
.body-credit-list a:hover{text-decoration:underline}

.status-line{font-size:11px;line-height:1.45;color:var(--ink-2);margin-top:8px;min-height:16px;word-break:break-word}
.status-line.error{color:var(--danger)}
.progress{height:5px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.variant-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.variant-item{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;cursor:pointer;padding:2px;transition:border-color .15s,opacity .15s}
.variant-item:hover{border-color:var(--accent)}
.variant-item.selected{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(198,75,50,.18)}
.variant-item.unusable{opacity:.58}
.variant-item img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.variant-item .vtag{position:absolute;left:4px;top:4px;max-width:calc(100% - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;line-height:1.4;font-weight:700;background:rgba(35,28,22,.82);color:#fff;border-radius:5px;padding:1px 6px}
.variant-item.selected .vtag.good{background:rgba(198,75,50,.94)}
.variant-item .vtag.warn{background:rgba(184,121,22,.92)}
.variant-item .vtag.muted{background:rgba(105,96,88,.82)}

.pool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px;max-height:240px;overflow:auto;padding:2px}
.pool-item{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:10px 10px;background-position:0 0,5px 5px;cursor:grab;overflow:hidden;padding:2px}
.pool-item:hover{border-color:var(--accent)}
.pool-item.selected{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(198,75,50,.18)}
.pool-item img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.pool-item .pidx{position:absolute;left:3px;top:3px;font-size:9px;font-weight:700;background:rgba(35,28,22,.72);color:#fff;border-radius:4px;padding:0 4px;line-height:1.4}
.pool-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}

.sheet-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sheet-head h2{font-size:15px;margin:0}
.sheet-head .meta{font-size:11px;color:var(--ink-3)}
.sheet-tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sheet-wrap{display:flex;justify-content:center;padding:4px 0}
.native-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.native-warn{font-size:12px;line-height:1.45;color:#7a4b06;background:#fdf3dc;border:1px solid #ead19a;border-radius:10px;padding:9px 11px;margin-bottom:10px}
.native-warn-msg{font-weight:600}
.native-actions .btn.warn-act{border-color:#d8ae5e;background:#fff8e6;color:#7a4b06}
.native-actions .btn.warn-act:hover{border-color:var(--warn);background:#fff3d1}
.sheet-grid{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:6px;width:min(100%,580px)}
.sheet-grid .corner{min-height:18px}
.colhead{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center}
.rowhead{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:.12em}

.cell{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:12px 12px;background-position:0 0,6px 6px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.cell:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(198,75,50,.1)}
.cell.drag-over{border:2px dashed var(--accent);background-color:var(--accent-soft)}
.cell.assign-target{box-shadow:0 0 0 2px rgba(198,75,50,.35)}
.cell.overflow{border:2px solid var(--warn);box-shadow:inset 0 0 0 1px rgba(184,121,22,.16)}
.cell img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.cell img.ghost{opacity:.2;filter:grayscale(1)}
.cell .badge{position:absolute;left:4px;top:4px;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(255,253,248,.88);color:var(--ok)}
.cell .badge.empty{color:var(--ink-3)}
.cell .badge.warn{background:#fdf3dc;color:#8a5304;border:1px solid #e2bc6b}
.cell .idx{position:absolute;right:4px;bottom:4px;font-size:9px;padding:0 4px;border-radius:4px;background:rgba(30,24,18,.58);color:#fff;line-height:1.4}

.sheet-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

.preview-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.preview-stage{width:200px;height:200px;border:1px solid var(--line);border-radius:12px;background-color:#fff;background-image:linear-gradient(45deg,#f0ece3 25%,transparent 25%,transparent 75%,#f0ece3 75%),linear-gradient(45deg,#f0ece3 25%,transparent 25%,transparent 75%,#f0ece3 75%);background-size:14px 14px;background-position:0 0,7px 7px;display:grid;place-items:center;overflow:hidden;flex:none}
#previewCanvas{image-rendering:pixelated}
.preview-info{flex:1;min-width:200px}
.preview-info h3{margin:0 0 4px;font-size:14px}
.preview-info .sub{font-size:11px;color:var(--ink-3);margin:0 0 9px}
.seg-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg-btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;font-size:11px;font-weight:600;padding:4px 9px;color:var(--ink-2)}
.seg-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

.modal{border:0;padding:0;background:transparent;max-width:min(780px,96vw);width:100%;max-height:94dvh;margin:auto;border-radius:18px;box-shadow:0 30px 80px -30px rgba(20,15,10,.55)}
.modal::backdrop{background:rgba(35,28,22,.46);backdrop-filter:blur(3px)}
.modal-box{background:var(--paper-2);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;max-height:94dvh}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{margin:0;font-size:15px}
.modal-head p{margin:2px 0 0;font-size:11px;color:var(--ink-3)}
.modal-head .x{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--fill);font-size:16px}
.modal-body{padding:14px 16px;overflow:auto;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:11px 16px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}

.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.config-grid .full{grid-column:1/-1}

.editor-layout{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.edit-stage{width:min(384px,82vw);aspect-ratio:1/1;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:16px 16px;background-position:0 0,8px 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;flex:none}
#editCanvas{width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair;display:block}
#editMaskCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;opacity:.55}
.editor-tools{flex:1;min-width:210px;display:flex;flex-direction:column;gap:9px}
.tool-group{display:flex;flex-direction:column;gap:5px}
.tool-group-label{font-size:10px;font-weight:700;color:var(--ink-3)}
.tool-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tool{min-height:29px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-size:11px;font-weight:600;color:var(--ink-2)}
.tool:hover{border-color:var(--line-2);color:var(--ink)}
.tool.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tool.primary-tool{background:var(--accent);border-color:var(--accent);color:#fff}
.tool.primary-tool:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.tool:disabled{opacity:.42;cursor:not-allowed}
.redraw-note{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:6px 8px;font-size:12px;outline:none}
.redraw-note:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(198,75,50,.1)}
.redraw-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-2)}
.redraw-bar.error{color:var(--danger)}
.redraw-bar span{flex:1;min-width:0;word-break:break-word}
.editor-tools input[type=color]{width:34px;height:29px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:1px;cursor:pointer}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(12px);z-index:9999;background:rgba(35,28,22,.92);color:#fff;border-radius:10px;padding:9px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:940px){
  .layout{grid-template-columns:1fr;padding:12px 10px 28px;gap:12px}
  .main{order:1}
  .side{order:2}
}
@media(max-width:480px){
  .app-header{padding:10px 12px;gap:8px}
  .brand h1{font-size:15px}
  .logo{width:34px;height:34px;font-size:16px}
  .header-actions{width:100%;justify-content:flex-start}
  .header-actions .btn{min-height:30px;padding:0 9px;font-size:11px}
  .card{padding:12px}
  .field-row,.config-grid{grid-template-columns:1fr}
  .sheet-grid{grid-template-columns:26px repeat(3,minmax(0,1fr));gap:4px}
  .cell .idx{display:none}
  .cell .badge{font-size:8px;padding:1px 3px}
  .preview-stage{width:148px;height:148px;margin:0 auto}
  .body-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .variant-grid{gap:8px}
  .native-actions{gap:8px}
  .native-actions .btn.sm{min-height:36px;padding:0 12px;font-size:12px;flex:1 1 auto}
  .pool-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .edit-stage{width:min(320px,84vw)}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">步</div>
    <div>
      <h1>RPG Maker MZ 行走图生成器</h1>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn" id="btnConfig">接口配置</button>
    <button class="btn" id="btnSaveProject">保存工程</button>
    <button class="btn" id="btnLoadProject">导入工程</button>
    <button class="btn primary" id="btnExport">导出 PNG</button>
  </div>
</header>

<main class="layout">
  <aside class="side">
    <section class="card">
      <h2><span class="n">1</span>获取素材</h2>
      <div class="tabs" id="sourceTabs">
        <button class="tab on" data-tab="ai">AI 生成</button>
        <button class="tab" data-tab="import">直接导入</button>
      </div>

      <!-- 主路线：带参考图走 edits 一次出 12 帧，也支持单方向 4 帧重做 -->
      <div id="paneAi">
        <div class="upload-box">
          <input type="file" id="fileCharRef" accept="image/*">
          <img class="upload-thumb" id="prevCharRef" alt="" hidden>
          <div class="upload-meta">
            <strong id="charRefTitle">上传角色参考图</strong>
            <span id="charRefSub">未上传</span>
          </div>
          <button class="btn sm upload-clear" id="btnClearCharRef" type="button" hidden>清除</button>
        </div>

        <div class="field">
          <span>素体</span>
          <div class="body-grid" id="baseBodyGrid" role="radiogroup" aria-label="素体"></div>
          <details class="body-credits" id="baseBodyCredits">
            <summary>素体来源</summary>
            <ul class="body-credit-list" id="baseBodyCreditList"></ul>
          </details>
        </div>
        <input type="file" id="fileCustomBody" accept="image/png,image/*" hidden>

        <label class="field">
          <span>角色描述</span>
          <textarea id="charDesc" rows="2" placeholder="例如：银白短发，蓝色披风，深色长裤与棕靴，Q版RPG角色"></textarea>
        </label>
        <label class="field">
          <span>画风提示词</span>
          <textarea id="styleDesc" rows="2">pixel art, chibi RPG character sprite, crisp outline, full color</textarea>
        </label>

        <div class="field-row" style="margin-top:9px">
          <label class="field">
            <span>模型 ID</span>
            <input id="aiModel" list="modelPresets" placeholder="gpt-image-2.6">
          </label>
          <label class="field">
            <span>生成背景</span>
            <select id="aiBgType">
              <option value="transparent">真透明（推荐）</option>
              <option value="magenta">品红 #FF00FF</option>
              <option value="white">纯白 #FFFFFF</option>
            </select>
          </label>
        </div>

        <div class="field-row" style="margin-top:9px">
          <label class="field">
            <span>请求尺寸</span>
            <select id="seqSize">
              <option value="1024x1024">1024 × 1024</option>
              <option value="1536x1024">1536 × 1024</option>
              <option value="1024x1536">1024 × 1536</option>
              <option value="512x512">512 × 512</option>
            </select>
          </label>
          <label class="field">
            <span>生成质量</span>
            <select id="seqQuality">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="auto">auto</option>
            </select>
          </label>
        </div>

        <div class="field-row" style="margin-top:9px">
          <label class="field">
            <span>重做方向</span>
            <select id="aiDir">
              <option value="0">下</option>
              <option value="1">左</option>
              <option value="2">右</option>
              <option value="3">上</option>
            </select>
          </label>
          <label class="field">
            <span>帧间隔 (ms)</span>
            <input id="seqDuration" type="number" min="20" max="2000" step="10" value="200">
          </label>
        </div>

        <div class="field-row" style="margin-top:10px">
          <button class="btn primary" id="btnGenSheet12" type="button">一次生成 12 帧</button>
          <button class="btn" id="btnGenOneDir" type="button">重做本方向</button>
        </div>
        <button class="btn" id="btnStopGen" type="button" style="width:100%;margin-top:7px" disabled>停止</button>
      </div>

      <!-- 直接导入 -->
      <div id="paneImport" hidden>
        <div class="upload-box">
          <input type="file" id="fileDirectImport" accept="image/png,image/jpeg,image/webp,image/gif,.png,.jpg,.jpeg,.webp,.gif">
          <div class="upload-meta">
            <strong>选择图片或 GIF 文件</strong>
            <span id="impFileLabel">未选择文件</span>
          </div>
        </div>

        <div class="field-row" style="margin-top:9px">
          <label class="field">
            <span>拆帧方式</span>
            <select id="impSplitMode">
              <option value="auto">自动检测</option>
              <option value="grid">手动网格</option>
            </select>
          </label>
          <label class="field">
            <span>导入去向</span>
            <select id="impTarget">
              <option value="all">按 4×3 填入全部</option>
              <option value="row:0">填入「下」方向</option>
              <option value="row:1">填入「左」方向</option>
              <option value="row:2">填入「右」方向</option>
              <option value="row:3">填入「上」方向</option>
              <option value="pool">仅放入待分配帧池</option>
            </select>
          </label>
        </div>

        <div class="field-row" id="impGridRow" style="margin-top:9px" hidden>
          <label class="field">
            <span>行数</span>
            <input id="impRows" type="number" min="1" max="16" value="4">
          </label>
          <label class="field">
            <span>列数</span>
            <input id="impCols" type="number" min="1" max="16" value="3">
          </label>
        </div>

        <div class="field-row" style="margin-top:9px">
          <button class="btn" id="btnFillTemplate" type="button">用内置模板填充</button>
          <button class="btn" id="btnImportItemRef" type="button">载入手持物素材</button>
        </div>
        <input type="file" id="fileItemRef" accept="image/*" hidden>
      </div>

      <datalist id="modelPresets">
        <option value="gpt-image-2.6"></option>
        <option value="gpt-image-2.6-sunburst"></option>
        <option value="gpt-image-2.6-flare"></option>
      </datalist>

      <div class="status-line" id="genStatus">准备就绪</div>
      <div class="progress"><i id="genProgress"></i></div>
    </section>

    <!-- 多变体选择器 -->
    <section class="card" id="variantCard" hidden>
      <h2><span class="n">V</span>选择生成变体 (<span id="variantCount">0</span>)</h2>
      <div class="variant-grid" id="variantGrid"></div>
    </section>

    <!-- 拆帧与分配区 -->
    <section class="card" id="poolCard" hidden>
      <h2><span class="n">2</span>拆帧分配 (<span id="poolCount">0</span>)</h2>
      <div class="pool-grid" id="poolGrid"></div>
      <div class="pool-actions">
        <select id="poolTargetDir" class="btn sm" style="padding:0 6px">
          <option value="0">下</option>
          <option value="1">左</option>
          <option value="2">右</option>
          <option value="3">上</option>
        </select>
        <button class="btn sm" id="btnPoolAutoRow" type="button">前3帧填入该行</button>
        <button class="btn sm" id="btnPoolAutoAll" type="button">按序填满3×4</button>
        <button class="btn sm danger" id="btnPoolClear" type="button">清空帧池</button>
      </div>
      <div class="status-line" id="poolSelectionStatus" hidden></div>
    </section>

    <!-- 统一后处理参数 -->
    <section class="card">
      <h2><span class="n">3</span>统一后处理</h2>
      <div class="field-row">
        <label class="field">
          <span>单帧尺寸</span>
          <select id="ppSize">
            <option value="48">48 × 48 (144×192)</option>
            <option value="64">64 × 64 (192×256)</option>
            <option value="96">96 × 96 (288×384)</option>
          </select>
        </label>
        <label class="field">
          <span>去背景模式</span>
          <select id="ppBgMode">
            <option value="auto">自动(透明/品红/白底)</option>
            <option value="chroma">品红/绿幕色键</option>
            <option value="flood">边缘泛洪</option>
            <option value="none">不去背景</option>
          </select>
        </label>
      </div>

      <div class="field-row" style="margin-top:9px">
        <label class="field">
          <span>背景容差 <em id="ppBgTolVal">36</em></span>
          <input id="ppBgTol" type="range" min="4" max="90" value="36">
        </label>
        <label class="field">
          <span>调色板色数</span>
          <select id="ppPalette">
            <option value="32">32 色（推荐）</option>
            <option value="24">24 色</option>
            <option value="16">16 色</option>
            <option value="8">8 色</option>
            <option value="0">不量化（原色）</option>
          </select>
        </label>
      </div>

      <div class="field-row" style="margin-top:9px">
        <label class="field">
          <span>脚底基线留白</span>
          <select id="ppFootMargin">
            <option value="1">1 px</option>
            <option value="0">0 px</option>
            <option value="2">2 px</option>
          </select>
        </label>
        <label class="field">
          <span>Alpha 二值化阈值 <em id="ppAlphaVal">128</em></span>
          <input id="ppAlphaThresh" type="range" min="16" max="240" value="128">
        </label>
      </div>

      <div class="field-row" style="margin-top:10px">
        <label class="check"><input type="checkbox" id="ppPixelSnap" checked> 真实像素格还原</label>
        <label class="check"><input type="checkbox" id="ppLockUpper" checked> 锁定头和上身</label>
  
      </div>

      <div class="field-row" style="margin-top:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <label class="check"><input type="checkbox" id="ppOutline"> 1px 外描边</label>
          <input type="color" id="ppOutlineColor" value="#1e1a18" style="width:28px;height:24px;border:1px solid var(--line);border-radius:5px;padding:1px">
        </div>
        <span></span>
      </div>

      <button class="btn primary" id="btnReprocessAll" type="button" style="width:100%;margin-top:11px">重新统一处理全部帧</button>
    </section>
  </aside>

  <section class="main">
    <div class="card">
      <div class="sheet-head">
        <div>
          <h2>3 × 4 行走图</h2>
          <div class="meta" id="sheetInfo">0 / 12 帧 · 48×48 · 输出 144×192</div>
        </div>
        <div class="sheet-tools">
          <button class="btn sm" id="btnMirrorL2R" type="button">左行→镜像右行</button>
          <button class="btn sm" id="btnMirrorR2L" type="button">右行→镜像左行</button>
          <button class="btn sm danger" id="btnClearAll" type="button">清空全部</button>
        </div>
      </div>

      <div class="native-warn" id="sheetNativeWarn" hidden></div>

      <div class="sheet-wrap">
        <div class="sheet-grid" id="sheetGrid"></div>
      </div>

      <div class="sheet-foot">
        <label class="check"><input type="checkbox" id="mzPrefix" checked> 文件名加 <code>$</code> 前缀</label>
        <span style="flex:1"></span>
        <button class="btn sm" id="btnUploadItemQuick" type="button">上传贴图物品</button>
        <button class="btn primary sm" id="btnExportFoot" type="button">导出透明 PNG</button>
      </div>
    </div>

    <div class="card preview-card">
      <div class="preview-stage">
        <canvas id="previewCanvas" width="96" height="96"></canvas>
      </div>
      <div class="preview-info">
        <h3>动画预览</h3>
        <p class="sub" id="previewMeta">下 · 2× 缩放</p>
        <div class="seg-row" id="previewDirs">
          <button class="seg-btn on" data-dir="0" type="button">下</button>
          <button class="seg-btn" data-dir="1" type="button">左</button>
          <button class="seg-btn" data-dir="2" type="button">右</button>
          <button class="seg-btn" data-dir="3" type="button">上</button>
        </div>
        <div class="seg-row" id="previewZooms">
          <button class="seg-btn" data-zoom="1" type="button">1×</button>
          <button class="seg-btn on" data-zoom="2" type="button">2×</button>
          <button class="seg-btn" data-zoom="3" type="button">3×</button>
          <button class="seg-btn" data-zoom="4" type="button">4×</button>
        </div>
        <div class="seg-row" style="margin-bottom:0">
          <button class="btn sm primary" id="btnPlay" type="button">暂停</button>
          <button class="btn sm" id="btnStep" type="button">单步</button>
          <label class="check" style="margin-left:4px;font-size:11px">
            间隔 <input id="previewSpeed" type="number" min="60" max="1000" step="20" value="180" style="width:60px;padding:3px 6px;border:1px solid var(--line);border-radius:6px"> ms
          </label>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- 接口配置弹窗 -->
<dialog id="configDialog" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3>接口配置</h3>
      </div>
      <button class="x" data-close="configDialog" type="button">×</button>
    </div>
    <div class="modal-body">
      <div class="config-grid">
        <label class="field full">
          <span>Base URL</span>
          <input id="cfgBase" placeholder="https://draw.pluspro.team/v1" spellcheck="false">
        </label>
        <label class="field full">
          <span>API Key</span>
          <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
        </label>
        <label class="field">
          <span>默认模型</span>
          <input id="cfgModel" list="modelPresets" placeholder="gpt-image-2.6" spellcheck="false">
        </label>
        <label class="field">
          <span>超时（秒）</span>
          <input id="cfgTimeout" type="number" min="30" max="600" value="300">
        </label>
        <label class="field">
          <span>参考图生成路径 (edits)</span>
          <input id="cfgEditsPath" placeholder="/images/edits" spellcheck="false">
        </label>
        <label class="field">
          <span>文生图路径 (generations)</span>
          <input id="cfgGenPath" placeholder="/images/generations" spellcheck="false">
        </label>
      </div>
      <div class="status-line" id="cfgTestResult"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnTestApi" type="button">测试连接</button>
      <button class="btn primary" id="btnSaveConfig" type="button">保存配置</button>
    </div>
  </div>
</dialog>

<!-- 逐帧像素编辑器弹窗 -->
<dialog id="editorDialog" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3 id="editorTitle">编辑帧</h3>
        <p id="editorSub">48 × 48</p>
      </div>
      <button class="x" data-close="editorDialog" type="button">×</button>
    </div>
    <div class="modal-body">
      <div class="editor-layout">
        <div class="edit-stage">
          <canvas id="editCanvas" width="48" height="48"></canvas>
          <canvas id="editMaskCanvas" width="48" height="48"></canvas>
        </div>
        <div class="editor-tools">
          <div class="tool-group">
            <span class="tool-group-label">AI 重画</span>
            <div class="tool-row">
              <button class="tool primary-tool" id="btnRedrawFrame" type="button">重画这一帧</button>
              <button class="tool" data-tool="mask" id="btnMaskBrush" type="button">涂遮罩</button>
              <button class="tool" data-tool="maskEraser" id="btnMaskEraser" type="button">擦遮罩</button>
              <button class="tool" id="btnClearMask" type="button" disabled>清遮罩</button>
            </div>
            <input class="redraw-note" id="redrawNote" type="text" placeholder="选填：重画说明（如 调矮头顶 / 修右手）">
            <div class="redraw-bar" id="editorRedrawBar" hidden>
              <span id="editorRedrawStatus"></span>
              <button class="tool" id="btnStopRedraw" type="button">停止</button>
            </div>
          </div>

          <div class="tool-group">
            <span class="tool-group-label">绘图工具</span>
            <div class="tool-row">
              <button class="tool on" data-tool="brush" type="button">画笔</button>
              <button class="tool" data-tool="eraser" type="button">橡皮</button>
              <button class="tool" data-tool="eyedrop" type="button">取色</button>
              <input type="color" id="editColor" value="#c64b32" title="画笔颜色">
              <button class="tool" id="btnUndo" type="button">撤销</button>
            </div>
            <label class="field" style="margin-top:4px">
              <span>笔刷大小 <em id="brushLabel">1 px</em></span>
              <input type="range" id="editBrush" min="1" max="8" value="1">
            </label>
          </div>

          <div class="tool-group">
            <span class="tool-group-label">1px 微移（对齐脚位）</span>
            <div class="tool-row">
              <button class="tool" id="btnNudgeLeft" type="button">← 左</button>
              <button class="tool" id="btnNudgeUp" type="button">↑ 上</button>
              <button class="tool" id="btnNudgeDown" type="button">↓ 下</button>
              <button class="tool" id="btnNudgeRight" type="button">→ 右</button>
              <button class="tool" id="btnFlipFrame" type="button">水平翻转</button>
            </div>
          </div>

          <div class="tool-group">
            <span class="tool-group-label">从同行另一帧复制</span>
            <div class="tool-row" id="copyRowBtns"></div>
          </div>

          <div class="tool-group">
            <span class="tool-group-label">辅助操作</span>
            <div class="tool-row">
              <button class="tool" id="btnReprocessFrame" type="button">重跑此帧后处理</button>
              <button class="tool" id="btnStampItem" type="button" disabled>贴物品</button>
              <button class="tool" id="btnApplyTemplate" type="button">套用模板</button>
              <button class="tool" id="btnImportFrame" type="button">导入单帧</button>
              <button class="tool danger" id="btnClearFrame" type="button">清空</button>
            </div>
          </div>
          <input type="file" id="fileFrame" accept="image/*" hidden>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="editorDialog" type="button">取消</button>
      <button class="btn primary" id="btnSaveFrame" type="button">保存此帧</button>
    </div>
  </div>
</dialog>

  function srgbToLinear(u8){

    var rl = srgbToLinear(r), gl = srgbToLinear(g), bl = srgbToLinear(b);
    var l = 0.4122214708 * rl + 0.5363325363 * gl + 0.0514459929 * bl;
    var m = 0.2119034982 * rl + 0.6806995451 * gl + 0.1073969566 * bl;
    var s = 0.0883024619 * rl + 0.2817188376 * gl + 0.6299787005 * bl;
    var l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
    return [
      0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
      1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
      0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
    ];
  }
  function oklabDistSq(a, b){
    var dl = a[0] - b[0], da = a[1] - b[1], db = a[2] - b[2];
    return dl * dl + da * da + db * db;
  }
  function oklabWeightedDistSq(a, b){

  // -------------------------------------------------------------------------
  // 去背景：品红/绿幕色键 + 白底/假棋盘格中性度守卫泛洪 + 领口下口袋重开 + 2px 边缘去染
  // -------------------------------------------------------------------------
  function erode2AndDecontaminate(d, w, h, keyKind, bgR, bgG, bgB, tol){
    // fg[p]=1 表示当前不透明前景
    var n = w * h;
    var fg = new Uint8Array(n);
    var minY = h, maxY = -1;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var idx = y * w + x;
        if (d[idx * 4 + 3] >= 128) {
          fg[idx] = 1;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxY < 0) return;

    // 2 次 4-邻域腐蚀得到核心区 core
    var core = new Uint8Array(fg);
    for (var pass = 0; pass < 2; pass++) {
      var next = new Uint8Array(n);
      for (var y2 = 1; y2 < h - 1; y2++) {
        for (var x2 = 1; x2 < w - 1; x2++) {
          var p = y2 * w + x2;
          if (core[p] && core[p - 1] && core[p + 1] && core[p - w] && core[p + w]) next[p] = 1;
        }
      }
      core = next;
    }

    // BFS 从 core 向外传播 2 步，记录每个外圈像素对应的最近核心像素索引
    var nearest = new Int32Array(n).fill(-1);
    var q = new Int32Array(n);
    var head = 0, tail = 0;
    for (var i = 0; i < n; i++) {
      if (core[i]) { nearest[i] = i; q[tail++] = i; }
    }
    while (head < tail) {
      var cur = q[head++];
      var cx = cur % w, cy = (cur / w) | 0;
      var src = nearest[cur];
      var nbs = [
        cx > 0 ? cur - 1 : -1,
        cx < w - 1 ? cur + 1 : -1,
        cy > 0 ? cur - w : -1,
        cy < h - 1 ? cur + w : -1
      ];
      for (var ni = 0; ni < 4; ni++) {
        var nb = nbs[ni];
        if (nb >= 0 && fg[nb] && nearest[nb] < 0) {
          nearest[nb] = src;
          q[tail++] = nb;
        }
      }
    }

    // 对外圈 2px 边缘像素做去染 / 去溢色
    for (var p2 = 0; p2 < n; p2++) {
      if (!fg[p2] || core[p2]) continue;
      var o = p2 * 4;
      var r = d[o], g = d[o + 1], b = d[o + 2];
      var srcIdx = nearest[p2];

      if (keyKind === 'magenta') {
        var ex = Math.min(r, b) - g;
        if (ex > 0) {
          r = Math.max(0, r - ex);
          b = Math.max(0, b - ex);
          d[o] = r; d[o + 2] = b;
          if (ex > 24 && srcIdx >= 0) {
            var so = srcIdx * 4;
            d[o] = d[so]; d[o + 1] = d[so + 1]; d[o + 2] = d[so + 2];
          }
        }
      } else if (keyKind === 'green') {
        var exG = g - Math.max(r, b);
        if (exG > 0) {
          g = Math.max(0, g - exG);
          d[o + 1] = g;
          if (exG > 24 && srcIdx >= 0) {
            var so2 = srcIdx * 4;
            d[o] = d[so2]; d[o + 1] = d[so2 + 1]; d[o + 2] = d[so2 + 2];
          }
        }
      } else {
        // 白底/纯色外圈：中性且明显贴近背景色的半混叠边替换为最近核心像素色
        var dr = r - bgR, dg = g - bgG, db = b - bgB;
        var dist = Math.sqrt(dr * dr + dg * dg + db * db);
        var chroma = Math.max(dr, dg, db) - Math.min(dr, dg, db);
        if (srcIdx >= 0 && dist < tol * 2.2 && chroma < 24) {
          var so3 = srcIdx * 4;
          d[o] = d[so3]; d[o + 1] = d[so3 + 1]; d[o + 2] = d[so3 + 2];
        }
      }
    }
  }

  function cleanNativeAlphaCanvas(d, w, h, alphaThresh){
    var n = w * h;
    var origA = new Uint8Array(n);
    var fg = new Uint8Array(n);
    for (var i = 0; i < n; i++) {
      var o = i * 4;
      origA[i] = d[o + 3];
      if (d[o + 3] >= alphaThresh) {
        fg[i] = 1;
        d[o + 3] = 255;
      } else {
        d[o] = 0; d[o + 1] = 0; d[o + 2] = 0; d[o + 3] = 0;
      }
    }

    // 清理面积 <= 3 的孤立悬浮杂点
    var vis = new Uint8Array(n);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var s = y * w + x;
        if (!fg[s] || vis[s]) continue;
        var q = [s], head = 0;
        vis[s] = 1;
        while (head < q.length) {
          var cur = q[head++];
          var cx = cur % w, cy = (cur / w) | 0;
          for (var dy = -1; dy <= 1; dy++) {
            for (var dx = -1; dx <= 1; dx++) {
              if (!dx && !dy) continue;
              var nx = cx + dx, ny = cy + dy;
              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
              var nb = ny * w + nx;
              if (fg[nb] && !vis[nb]) { vis[nb] = 1; q.push(nb); }
            }
          }
        }
        if (q.length <= 3) {
          for (var qi = 0; qi < q.length; qi++) {
            var k = q[qi];
            fg[k] = 0;
            var ko = k * 4;
            d[ko] = 0; d[ko + 1] = 0; d[ko + 2] = 0; d[ko + 3] = 0;
          }
        }
      }
    }

    // 腐蚀 2px 得核心区，对原半透明外圈（带蓝/粉色抗锯齿杂边）用最近核心色替换
    var core = new Uint8Array(fg);
    for (var pass = 0; pass < 2; pass++) {
      var nxt = new Uint8Array(n);
      for (var y2 = 1; y2 < h - 1; y2++) {
        for (var x2 = 1; x2 < w - 1; x2++) {
          var p = y2 * w + x2;
          if (core[p] && core[p - 1] && core[p + 1] && core[p - w] && core[p + w]) nxt[p] = 1;
        }
      }
      core = nxt;
    }
    var nearest = new Int32Array(n).fill(-1);
    var bq = new Int32Array(n), bh = 0, bt = 0;
    for (var i2 = 0; i2 < n; i2++) if (core[i2]) { nearest[i2] = i2; bq[bt++] = i2; }
    while (bh < bt) {
      var cur2 = bq[bh++];
      var cx2 = cur2 % w, cy2 = (cur2 / w) | 0;
      var src = nearest[cur2];
      var nbs = [cx2 > 0 ? cur2 - 1 : -1, cx2 < w - 1 ? cur2 + 1 : -1, cy2 > 0 ? cur2 - w : -1, cy2 < h - 1 ? cur2 + w : -1];
      for (var ni = 0; ni < 4; ni++) {
        var nb2 = nbs[ni];
        if (nb2 >= 0 && fg[nb2] && nearest[nb2] < 0) { nearest[nb2] = src; bq[bt++] = nb2; }
      }
    }
    for (var p2 = 0; p2 < n; p2++) {
      if (!fg[p2] || core[p2]) continue;
      if (origA[p2] >= 235) continue;
      var po = p2 * 4;
      var r = d[po], g = d[po + 1], b = d[po + 2];
      var blueFringe = b - Math.max(r, g) > 22;
      var pinkFringe = Math.min(r, b) - g > 18;
      if ((blueFringe || pinkFringe || origA[p2] < 200) && nearest[p2] >= 0) {
        var so = nearest[p2] * 4;
        d[po] = d[so]; d[po + 1] = d[so + 1]; d[po + 2] = d[so + 2];
      }
    }
  }

  function removeBackgroundCanvas(canvas, bgMode, bgTol, alphaThresh){
    var w = canvas.width, h = canvas.height;
    if (bgMode === 'none') return canvas;
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var imgData = ctx.getImageData(0, 0, w, h);
    var d = imgData.data;

    var borderTotal = 0, borderTrans = 0;
    var buckets = {};
    function sampleBorder(x, y){
      borderTotal++;
      var o = (y * w + x) * 4;
      if (d[o + 3] < 128) { borderTrans++; return; }
      var key = (d[o] >> 3) + ',' + (d[o + 1] >> 3) + ',' + (d[o + 2] >> 3);
      if (!buckets[key]) buckets[key] = { n: 0, r: 0, g: 0, b: 0 };
      var bk = buckets[key]; bk.n++; bk.r += d[o]; bk.g += d[o + 1]; bk.b += d[o + 2];
    }
    for (var x = 0; x < w; x++) { sampleBorder(x, 0); if (h > 1) sampleBorder(x, h - 1); }
    for (var y = 1; y < h - 1; y++) { sampleBorder(0, y); if (w > 1) sampleBorder(w - 1, y); }

    if (bgMode === 'auto' && borderTrans > borderTotal * 0.2) {
      cleanNativeAlphaCanvas(d, w, h, alphaThresh || 128);
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    var sortedBuckets = Object.keys(buckets).map(function(k){
      var b = buckets[k];
      return { n: b.n, r: Math.round(b.r / b.n), g: Math.round(b.g / b.n), b: Math.round(b.b / b.n) };
    }).sort(function(a, b){ return b.n - a.n; });
    if (!sortedBuckets.length) return canvas;

    var bg1 = sortedBuckets[0];
    var bg2 = sortedBuckets.length > 1 && sortedBuckets[1].n >= borderTotal * 0.08 ? sortedBuckets[1] : null;
    var magEx = Math.min(bg1.r, bg1.b) - bg1.g;
    var grnEx = bg1.g - Math.max(bg1.r, bg1.b);
    var keyKind = 'solid';
    if (bgMode === 'chroma' || (bgMode === 'auto' && magEx >= 40)) keyKind = 'magenta';
    else if (bgMode === 'auto' && grnEx >= 40) keyKind = 'green';

    var n = w * h;
    var tolSq = bgTol * bgTol * 3;
    var maxChroma = Math.max(16, bgTol * 0.5);

    function matchSolid(r, g, b, target){
      var dr = r - target.r, dg = g - target.g, db = b - target.b;
      if (dr * dr + dg * dg + db * db > tolSq) return false;
      return (Math.max(dr, dg, db) - Math.min(dr, dg, db)) <= maxChroma;
    }

    function isBgPixel(o){
      if (d[o + 3] < 16) return true;
      var r = d[o], g = d[o + 1], b = d[o + 2];
      if (keyKind === 'magenta') {
        var ex = Math.min(r, b) - g;
        var dr = r - bg1.r, dg = g - bg1.g, db = b - bg1.b;
        return ex >= Math.max(22, 72 - bgTol) || (dr * dr + dg * dg + db * db <= tolSq * 1.6 && ex >= 12);
      }
      if (keyKind === 'green') {
        var exG = g - Math.max(r, b);
        var dr2 = r - bg1.r, dg2 = g - bg1.g, db2 = b - bg1.b;
        return exG >= Math.max(22, 72 - bgTol) || (dr2 * dr2 + dg2 * dg2 + db2 * db2 <= tolSq * 1.6 && exG >= 12);
      }
      if (matchSolid(r, g, b, bg1)) return true;
      if (bg2 && matchSolid(r, g, b, bg2)) return true;
      return false;
    }

    // 1. 边缘泛洪
    var visited = new Uint8Array(n);
    var q = new Int32Array(n);
    var head = 0, tail = 0;
    function push(px, py){
      if (px < 0 || py < 0 || px >= w || py >= h) return;
      var idx = py * w + px;
      if (visited[idx]) return;
      visited[idx] = 1;
      q[tail++] = idx;
    }
    for (var bx = 0; bx < w; bx++) { push(bx, 0); push(bx, h - 1); }
    for (var by = 1; by < h - 1; by++) { push(0, by); push(w - 1, by); }

    while (head < tail) {
      var cur = q[head++];
      var o = cur * 4;
      if (!isBgPixel(o)) continue;
      d[o] = 0; d[o + 1] = 0; d[o + 2] = 0; d[o + 3] = 0;
      var cx = cur % w, cy = (cur / w) | 0;
      push(cx + 1, cy); push(cx - 1, cy); push(cx, cy + 1); push(cx, cy - 1);
    }

    // 2. 封闭背景口袋重开（色键高纯度区域全局重开；白底仅在领口线 y >= minY + 0.42*bh 以下重开）
    var fgMinY = h, fgMaxY = -1;
    for (var py = 0; py < h; py++) {
      for (var px = 0; px < w; px++) {
        if (d[(py * w + px) * 4 + 3] >= 128) {
          if (py < fgMinY) fgMinY = py;
          if (py > fgMaxY) fgMaxY = py;
        }
      }
    }
    if (fgMaxY >= fgMinY) {
      var collarY = fgMinY + Math.floor((fgMaxY - fgMinY + 1) * 0.62);
      var pVis = new Uint8Array(n);
      for (var sy = 0; sy < h; sy++) {
        for (var sx = 0; sx < w; sx++) {
          var sIdx = sy * w + sx;
          if (pVis[sIdx] || d[sIdx * 4 + 3] < 16) continue;
          var so = sIdx * 4;
          var sr = d[so], sg = d[so + 1], sb = d[so + 2];
          var isPurePocket = false;
          if (keyKind === 'magenta') {
            isPurePocket = (Math.min(sr, sb) - sg) >= 55;
          } else if (keyKind === 'green') {
            isPurePocket = (sg - Math.max(sr, sb)) >= 55;
          } else if (sy >= collarY) {
            var dr3 = sr - bg1.r, dg3 = sg - bg1.g, db3 = sb - bg1.b;
            isPurePocket = (dr3 * dr3 + dg3 * dg3 + db3 * db3 <= 12 * 12 * 3) && (Math.max(dr3, dg3, db3) - Math.min(dr3, dg3, db3) <= 10);
          }
          if (!isPurePocket) continue;

          // BFS 收集该封闭口袋
          var ph = 0;
          var pQ = [];
          pVis[sIdx] = 1; pQ.push(sIdx);
          var minPocketY = sy;
          while (ph < pQ.length) {
            var pc = pQ[ph++];

            var pnbs = [

              pcx < w - 1 ? pc + 1 : -1,
              pcy > 0 ? pc - w : -1,
              pcy < h - 1 ? pc + w : -1

            for (var k = 0; k < 4; k++) {
              var nb2 = pnbs[k];
              if (nb2 < 0 || pVis[nb2] || d[nb2 * 4 + 3] < 16) continue;
              var no = nb2 * 4;
              var nr = d[no], ng = d[no + 1], nbv = d[no + 2];
              var ok = false;
              if (keyKind === 'magenta') ok = (Math.min(nr, nbv) - ng) >= 48;
              else if (keyKind === 'green') ok = (ng - Math.max(nr, nbv)) >= 48;
              else {
                var dr4 = nr - bg1.r, dg4 = ng - bg1.g, db4 = nbv - bg1.b;
                ok = (dr4 * dr4 + dg4 * dg4 + db4 * db4 <= 12 * 12 * 3) && (Math.max(dr4, dg4, db4) - Math.min(dr4, dg4, db4) <= 12);
              }
              if (ok) { pVis[nb2] = 1; pQ.push(nb2); }
            }

          var minArea = keyKind === 'solid' ? 48 : 9;
          if (pQ.length >= minArea && (keyKind !== 'solid' || minPocketY >= collarY)) {
            for (var qi = 0; qi < pQ.length; qi++) {

            }
          }
        }
      }
    }

    // 3. 2px 边缘去染 + 品红/绿幕溢色消除
    erode2AndDecontaminate(d, w, h, keyKind, bg1.r, bg1.g, bg1.b, bgTol);

    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  function removeBackground(img, bgMode, bgTol, alphaThresh){
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;

    return removeBackgroundCanvas(c, bgMode, bgTol, alphaThresh);

  // -------------------------------------------------------------------------
  // 拆帧：4×3 网格主拆帧 + 连通区域/平滑列密度极小值自动拆帧
  // -------------------------------------------------------------------------
  function splitSheetGrid(src, rows, cols){
    rows = Math.max(1, rows | 0);
    cols = Math.max(1, cols | 0);
    return loadImg(src).then(function(im){
      var W = im.naturalWidth || im.width;
      var H = im.naturalHeight || im.height;
      var out = [];
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var sx = Math.round(c * W / cols);
          var sy = Math.round(r * H / rows);
          var ex = Math.round((c + 1) * W / cols);
          var ey = Math.round((r + 1) * H / rows);
          var sw = Math.max(1, ex - sx);
          var sh = Math.max(1, ey - sy);
          var cv = document.createElement('canvas');
          cv.width = sw; cv.height = sh;
          var ctx = cv.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(im, sx, sy, sw, sh, 0, 0, sw, sh);
          out.push(cv.toDataURL('image/png'));
        }
      }
      return out;
    });
  }

  function splitSheetAuto(src, bgMode, bgTol, expectedRows, expectedCols, validateLayout){
    return loadImg(src).then(function(im){
      var W = im.naturalWidth || im.width;
      var H = im.naturalHeight || im.height;

      // 若指定了 4×3 期待布局，先验证按投影空隙/密度极小值找到的 4×3 切分是否精确
      if (expectedRows && expectedCols) {
        var rowMass = new Float64Array(H);
        var colMass = new Float64Array(W);
        for (var y = 0; y < H; y++) {
          for (var x = 0; x < W; x++) {
            if (cd[(y * W + x) * 4 + 3] > 16) { rowMass[y]++; colMass[x]++; }

        }
        function findGridCuts(mass, len, count){
          var cuts = [0];
          var cell = len / count;

  function faceColorRegion(data, width, height, box){

  async function processFrames(input, pp, frozenPalette){

        overflow: tooLarge, blocked: blocked, fidelity: 1, center: dx + center, foot: bottom - 1, phaseX: it.phaseX, phaseY: it.phaseY, stepX: it.stepX, stepY: it.stepY,

  function resolveItemPayload(item){
    if (item.b64_json) {
      var mime = detectMimeFromBase64(item.b64_json);
      return Promise.resolve({
        mime: mime,
        dataUrl: 'data:' + mime + ';base64,' + item.b64_json,
        buffer: mime === 'image/gif' ? base64ToArrayBuffer(item.b64_json) : null
      });
    }
    if (item.url) {
      return fetch(item.url).then(function(r){ return r.arrayBuffer(); }).then(function(buf){
        var mime2 = detectMimeFromBytes(buf);
        var blob = new Blob([buf], { type: mime2 });
        return new Promise(function(resolve){
          var fr = new FileReader();
          fr.onload = function(){ resolve({ mime: mime2, dataUrl: String(fr.result || ''), buffer: mime2 === 'image/gif' ? buf : null }); };
          fr.readAsDataURL(blob);
        });
      });
    }
    return Promise.resolve(null);
  }

  // 解析返回的多个项：相邻 GIF+PNG 配对为同一变体（GIF 预览、PNG 拆帧），其余单张各自为变体
  function groupResponseVariants(resolvedItems){
    var items = resolvedItems.filter(Boolean);
    var variants = [];
    for (var i = 0; i < items.length; i++) {
      var cur = items[i];
      var nxt = items[i + 1];
      if (cur.mime === 'image/gif' && nxt && nxt.mime !== 'image/gif') {
        variants.push({ gifSrc: cur.dataUrl, gifBuf: cur.buffer, pngSrc: nxt.dataUrl });
        i++;
      } else if (cur.mime === 'image/gif') {
        variants.push({ gifSrc: cur.dataUrl, gifBuf: cur.buffer, pngSrc: '' });
      } else {
        variants.push({ gifSrc: '', gifBuf: null, pngSrc: cur.dataUrl });
      }
    }
    return variants;
  }

  // 单帧遮罩重画：整图+同尺寸透明洞 mask -> 只替换目标格、冻结色板、重判超限

  function describeMaskRegion(maskCanvas){
    var w = maskCanvas.width, h = maskCanvas.height;
    var d = maskCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
    var minX = w, maxX = -1, minY = h, maxY = -1;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] > 0) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return '';
    var cx = (minX + maxX) / (2 * w), cy = (minY + maxY) / (2 * h);
    var vPos = cy < 0.36 ? 'upper' : cy > 0.66 ? 'lower' : 'middle';
    var hPos = cx < 0.38 ? 'left' : cx > 0.62 ? 'right' : 'center';
    return vPos === 'middle' && hPos === 'center' ? 'center' : vPos + '-' + hPos;
  }

  function composeSheetAndMaskForCell(cellIndex, localMaskCanvas, baseFrameDataUrl){
    var sz = state.pp.size || 48;
    var hasRawSheet = !!state.rawSheet;

    function uniformCuts(len, count){
      var out = [0];
      for (var k = 1; k < count; k++) out.push(Math.round(k * len / count));
      out.push(len);
      return out;
    }

    function drawIntoCell(ctx, im, x0, y0, gw, gh, fillBg){
      if (fillBg) {
        ctx.fillStyle = fillBg;
        ctx.fillRect(x0, y0, gw, gh);
      } else {
        ctx.clearRect(x0, y0, gw, gh);
      }
      var isPixel = im.width <= sz * 1.5 && im.height <= sz * 1.5;
      var sc = isPixel
        ? Math.max(1, Math.floor(Math.min(gw / im.width, gh / im.height)))
        : Math.min(1, gw / im.width, gh / im.height);
      var dw = Math.max(1, Math.round(im.width * sc));
      var dh = Math.max(1, Math.round(im.height * sc));
      var dx = x0 + Math.floor((gw - dw) / 2);
      var dy = y0 + gh - dh;
      ctx.save();
      ctx.imageSmoothingEnabled = !isPixel;
      ctx.drawImage(im, dx, dy, dw, dh);
      ctx.restore();
    }

    var sheetPromise;
    if (hasRawSheet) {
      sheetPromise = loadImg(state.rawSheet).then(function(sheetIm){
        var W = sheetIm.naturalWidth || sheetIm.width;
        var H = sheetIm.naturalHeight || sheetIm.height;
        var cuts = (state.rawSheetCuts && state.rawSheetCuts.w === W && state.rawSheetCuts.h === H)
          ? state.rawSheetCuts
          : { w: W, h: H, rCuts: uniformCuts(H, 4), cCuts: uniformCuts(W, 3) };
        var sc = document.createElement('canvas');
        sc.width = W; sc.height = H;
        var sctx = sc.getContext('2d', { willReadFrequently: true });
        sctx.drawImage(sheetIm, 0, 0, W, H);
        var corner = sctx.getImageData(0, 0, 1, 1).data;
        var fillBg = corner[3] > 200 ? ('rgb(' + corner[0] + ',' + corner[1] + ',' + corner[2] + ')') : '';
        var tasks = [];
        for (var i = 0; i < 12; i++) {
          var forceCustom = (i === cellIndex && !!baseFrameDataUrl);
          var changed = forceCustom || state.edited[i] || !state.rawSheetCells || state.rawSheetCells[i] !== state.rawFrames[i];
          if (!changed) continue;
          var src = forceCustom ? baseFrameDataUrl : (state.edited[i] ? state.frames[i] : (state.rawFrames[i] || state.frames[i]));
          if (!src) continue;
          (function(idx, url){
            var r = Math.floor(idx / 3), c = idx % 3;
            var x0 = cuts.cCuts[c], y0 = cuts.rCuts[r];
            var gw = cuts.cCuts[c + 1] - x0, gh = cuts.rCuts[r + 1] - y0;
            tasks.push(loadImg(url).then(function(im){
              drawIntoCell(sctx, im, x0, y0, gw, gh, fillBg);
            }));
          })(i, src);
        }
        return Promise.all(tasks).then(function(){
          return { canvas: sc, W: W, H: H, rCuts: cuts.rCuts, cCuts: cuts.cCuts };
        });
      });
    } else {
      var srcs = [];
      for (var i = 0; i < 12; i++) {
        srcs.push((i === cellIndex && baseFrameDataUrl) ? baseFrameDataUrl : (state.edited[i] ? state.frames[i] : (state.rawFrames[i] || state.frames[i])));
      }
      sheetPromise = Promise.all(srcs.map(function(u){ return u ? loadImg(u) : Promise.resolve(null); })).then(function(imgs){
        var maxW = 0, maxH = 0;
        imgs.forEach(function(im){ if (im) { maxW = Math.max(maxW, im.width); maxH = Math.max(maxH, im.height); } });
        var cw = Math.max(maxW, sz * 6), ch = Math.max(maxH, sz * 6);
        var W = cw * 3, H = ch * 4;
        var sc = document.createElement('canvas');
        sc.width = W; sc.height = H;
        var sctx = sc.getContext('2d', { willReadFrequently: true });
        for (var j = 0; j < 12; j++) {
          if (!imgs[j]) continue;
          var r = Math.floor(j / 3), c = j % 3;
          drawIntoCell(sctx, imgs[j], c * cw, r * ch, cw, ch, '');
        }
        return { canvas: sc, W: W, H: H, rCuts: uniformCuts(H, 4), cCuts: uniformCuts(W, 3) };
      });
    }

    return sheetPromise.then(function(built){
      var W = built.W, H = built.H;
      var row = Math.floor(cellIndex / 3), col = cellIndex % 3;
      var x0 = built.cCuts[col], x1 = built.cCuts[col + 1];
      var y0 = built.rCuts[row], y1 = built.rCuts[row + 1];
      var gw = x1 - x0, gh = y1 - y0;

      var mc = document.createElement('canvas');
      mc.width = W; mc.height = H;
      var mctx = mc.getContext('2d');
      mctx.fillStyle = '#ffffff';
      mctx.fillRect(0, 0, W, H);

      var pad = 2;
      if (!localMaskCanvas) {
        var mx0 = Math.max(0, x0 - pad), my0 = Math.max(0, y0 - pad);
        var mx1 = Math.min(W, x1 + pad), my1 = Math.min(H, y1 + pad);
        mctx.clearRect(mx0, my0, mx1 - mx0, my1 - my0);
        return {
          sheetDataUrl: built.canvas.toDataURL('image/png'),
          maskDataUrl: mc.toDataURL('image/png'),
          maskRegionDesc: ''
        };
      }

      var framePromise = baseFrameDataUrl ? loadImg(baseFrameDataUrl) : Promise.resolve(null);
      return framePromise.then(function(frameIm){
        var cellCv = document.createElement('canvas');
        cellCv.width = gw; cellCv.height = gh;
        cellCv.getContext('2d').drawImage(built.canvas, x0, y0, gw, gh, 0, 0, gw, gh);
        removeBackgroundCanvas(cellCv, state.pp.bgMode === 'none' ? 'auto' : state.pp.bgMode, state.pp.bgTol, state.pp.alphaThresh);
        var cellBox = findBoundingBox(cellCv);

        var frameBox = null;
        if (frameIm) {
          var fc = document.createElement('canvas');
          fc.width = frameIm.width; fc.height = frameIm.height;
          fc.getContext('2d').drawImage(frameIm, 0, 0);
          frameBox = findBoundingBox(fc);
        }

        var mw = localMaskCanvas.width, mh = localMaskCanvas.height;
        var md = localMaskCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, mw, mh).data;
        var useSubBox = cellBox && frameBox && frameBox.bw > 0 && frameBox.bh > 0;
        var sxScale = useSubBox ? (cellBox.bw / frameBox.bw) : (gw / mw);
        var syScale = useSubBox ? (cellBox.bh / frameBox.bh) : (gh / mh);

        for (var ly = 0; ly < mh; ly++) {
          for (var lx = 0; lx < mw; lx++) {
            if (!md[(ly * mw + lx) * 4 + 3]) continue;
            var rx = useSubBox ? (x0 + cellBox.minX + (lx - frameBox.minX) * sxScale) : (x0 + lx * sxScale);
            var ry = useSubBox ? (y0 + cellBox.minY + (ly - frameBox.minY) * syScale) : (y0 + ly * syScale);
            var cx0 = Math.max(0, Math.floor(rx) - pad);
            var cy0 = Math.max(0, Math.floor(ry) - pad);
            var cx1 = Math.min(W, Math.ceil(rx + sxScale) + pad);
            var cy1 = Math.min(H, Math.ceil(ry + syScale) + pad);
            mctx.clearRect(cx0, cy0, cx1 - cx0, cy1 - cy0);
          }
        }
        return {
          sheetDataUrl: built.canvas.toDataURL('image/png'),
          maskDataUrl: mc.toDataURL('image/png'),
          maskRegionDesc: describeMaskRegion(localMaskCanvas)
        };
      });
    });
  }
