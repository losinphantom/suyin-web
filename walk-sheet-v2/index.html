    if (autoFrames.length === 1) return { url: autoFrames[0], cellHeight: (await loadImg(src)).height };
    var gridFrames = await splitSheetGrid(src, 4, 3);
    return { url: gridFrames[cellIndex], cellHeight: (await loadImg(src)).height / 4 };
  }

  function getExistingBaselineBottom(excludeIndex){
    var pp = state.pp;
    var size = pp.size;
    if (lastNativeStats && lastNativeStats.size === size && Number.isFinite(lastNativeStats.baseline)) {
      return lastNativeStats.baseline + 1;
    }
    var tasks = [];
    for (var i = 0; i < 12; i++) {
      if (i === excludeIndex || !state.frames[i] || state.overflow.indexOf(i) >= 0) continue;
      tasks.push(loadImg(state.frames[i]).then(function(im){
        if (im.width !== size || im.height !== size) return 0;
        var c = document.createElement('canvas'); c.width = size; c.height = size;
        c.getContext('2d').drawImage(im, 0, 0);
        var b = findBoundingBox(c);
        return b ? b.maxY + 1 : 0;
      }));
    }
    return Promise.all(tasks).then(function(vals){
      var maxBottom = vals.reduce(function(m, v){ return Math.max(m, v); }, 0);
      return maxBottom || (size - pp.footMargin - (pp.outline ? 1 : 0));
    });
  }

  async function evaluateSingleCellVariant(variant){
    var ci = variant.targetCell;
    var pp = Object.assign({}, state.pp);
    var size = pp.size;
    var extracted = await extractCellFromRedrawVariant(variant, ci);
    if (!extracted || !extracted.url) return null;
    var rawCellUrl = extracted.url;
    var source = state.bodyCellHeights[(state.sources[ci] || '').replace(/_r\d+$/, '')];
    var cellHeight = variant.useBodyGrid ? extracted.cellHeight : 0;
    var bodySetting = cellHeight && (source && source.size === size
      ? { height: cellHeight, mode: source.mode, size: size }
      : cellHeight);

    var clean = removeBackground(await loadImg(rawCellUrl), pp.bgMode, pp.bgTol, pp.alphaThresh);
    var bbox = findBoundingBox(clean);
    if (!bbox) return null;

    var item = { canvas: clean, bbox: bbox };
    if (pp.pixelSnap) {
      item.grid = measureFrameGrid(clean, bbox);
      if (bodySetting) {
        var chosen = snapSourceGroup([item], bodySetting, size);
        item = chosen.frames[0];
        bodySetting = chosen.setting;
      } else {
        item = snapFrameToNativePixelArt(clean, bbox, null, item.grid) || item;
      }
    }

    var b = item.bbox;
    var tooLarge = b.bw > size || b.bh > size;
    var blocked = pp.pixelSnap && tooLarge;
    var existingBottom = await getExistingBaselineBottom(ci);
    var bottom = Math.min(size, Math.max(existingBottom, Math.min(b.bh, size)));
    var scale = blocked || (pp.pixelSnap && !tooLarge) ? 1 : Math.min(1, bottom / b.bh, size / b.bw);
    var dw = Math.max(1, Math.round(b.bw * scale));
    var dh = Math.max(1, Math.round(b.bh * scale));
    var side = Math.min(pp.outline ? 2 : 1, Math.max(0, Math.floor((size - dw) / 2)));
    var center = computeUpperCenterX(item.canvas, b) * dw / b.bw;
    var dx = Math.max(side, Math.min(size - side - dw, Math.round(size / 2 - center)));
    var dy = bottom - dh;

    var outCanvas;
    if (blocked) {
      outCanvas = placeOverflowFrame(item.canvas, b, size, bottom);
    } else if (scale === 1) {
      outCanvas = nearestScaleIntoFrame(item.canvas, b, size, dw, dh, dx, dy);
    } else if (pp.pixelSnap) {
      outCanvas = dominantVoteScaleIntoFrame(item.canvas, b, size, dw, dh, dx, dy, true, pp.alphaThresh);
    } else {
      outCanvas = areaSampleIntoFrame(item.canvas, b, size, dw, dh, dx, dy, true, pp.alphaThresh);
    }

    var palette = state.palette;
    var standIndex = ci + 1 - ci % 3;
    var standCanvas;
    if (palette && palette.length && ci !== standIndex && state.frames[standIndex]) {
      var standImage = await loadImg(state.frames[standIndex]);
      standCanvas = document.createElement('canvas');
      standCanvas.width = standImage.width; standCanvas.height = standImage.height;
      standCanvas.getContext('2d').drawImage(standImage, 0, 0);
    }
    if (!palette && pp.paletteCount > 0) {
      var existingCanvases = await Promise.all(state.frames.map(function(u, idx){
        if (idx === ci || !u) return Promise.resolve(null);
        return loadImg(u).then(function(im){
          var c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
          c.getContext('2d').drawImage(im, 0, 0);
          return c;
        });
      }));
      existingCanvases[ci] = outCanvas;
      palette = makeOutputPalette(existingCanvases, pp);
      if (ci !== standIndex) standCanvas = existingCanvases[standIndex];
    }
    var standing = standCanvas && palette && paletteIndices(standCanvas, palette);
    var outline = resolvePaletteOutline(pp, palette);
    var fidelity = 1;
    var footY = bottom - 1;
    if (blocked) {
      finishPaletteFrame(outCanvas, palette, pp.alphaThresh, standing, outline);
    } else {
      var ctx = outCanvas.getContext('2d', { willReadFrequently: true });
      var before = ctx.getImageData(0, 0, size, size).data;
      if (outline) applyOutlineToCanvas(outCanvas, outline, bottom);
      finishPaletteFrame(outCanvas, palette, pp.alphaThresh, standing, outline);
      var after = ctx.getImageData(0, 0, size, size).data;
      var count = 0, loss = 0;
      for (var p = 0; p < before.length; p += 4) {
        if (!before[p + 3]) continue;
        count++;
        for (var ch = 0; ch < 4; ch++) loss += Math.abs(before[p + ch] - after[p + ch]);
      }
      fidelity = 1 - loss / (1020 * Math.max(1, count));

      if (variant.localMaskDataUrl && variant.baseFrameDataUrl) {
        var baseIm = await loadImg(variant.baseFrameDataUrl);
        var maskIm = await loadImg(variant.localMaskDataUrl);
        var merged = document.createElement('canvas'); merged.width = size; merged.height = size;
        var mctx = merged.getContext('2d', { willReadFrequently: true });
        mctx.drawImage(baseIm, 0, 0, size, size);
        var maskCv = document.createElement('canvas'); maskCv.width = size; maskCv.height = size;
        var maskCtx = maskCv.getContext('2d', { willReadFrequently: true });
        maskCtx.drawImage(maskIm, 0, 0, size, size);
        var baseImgData = mctx.getImageData(0, 0, size, size);
        var bd = baseImgData.data;
        var md = maskCtx.getImageData(0, 0, size, size).data;
        for (var mp = 0; mp < bd.length; mp += 4) {
          if (md[mp + 3] > 0) {
            bd[mp] = after[mp];
            bd[mp + 1] = after[mp + 1];
            bd[mp + 2] = after[mp + 2];
            bd[mp + 3] = after[mp + 3];
          }
        }
        mctx.putImageData(baseImgData, 0, 0);
        binaryAlpha(merged, pp.alphaThresh);
        outCanvas = merged;
      }

      var checks = inspectOutput([outCanvas], pp);
      if (checks.empty.length || checks.wrongSize.length || checks.softAlpha.length || checks.overBudget) return null;
      var finalBox = findBoundingBox(outCanvas);
      footY = finalBox ? finalBox.maxY : 0;
    }

    var frameStat = {
      index: ci, bw: b.bw, bh: b.bh, bodyGrid: !!item.bodyGrid, scale: scale, intPlace: scale === 1 && !blocked,
      overflow: tooLarge, blocked: blocked, fidelity: fidelity, center: dx + center, foot: footY,
      phaseX: item.phaseX, phaseY: item.phaseY, stepX: item.stepX, stepY: item.stepY,
      coherence: item.coherence || 0, error: item.error === undefined ? 1 : item.error, removed: item.removed || []
    };
    var score = Math.round(100 * ((item.coherence || 0) * 0.5 + fidelity * 0.5));
    return {
      targetMode: 'cell',
      cellIndex: ci,
      rawCellUrl: rawCellUrl,
      bodySetting: bodySetting,
      frameDataUrl: outCanvas.toDataURL('image/png'),
      source: nextSourceId(),
      palette: palette,
      blocked: blocked,
      isLocalMask: !!variant.localMaskDataUrl,
      frameStat: frameStat,
      result: { overflow: blocked ? [ci] : [] },
      score: score,
      eligible: !blocked && !(pp.pixelSnap && scale < 1)
    };
  }

  function commitSingleCellResult(checked){
    var ci = checked.cellIndex;
    state.rawFrames[ci] = checked.rawCellUrl;
    state.frames[ci] = checked.frameDataUrl;
    state.unlockedFrames[ci] = checked.frameDataUrl;
    state.sources[ci] = checked.source;
    if (checked.bodySetting) state.bodyCellHeights[checked.source] = checked.bodySetting;
    state.edited[ci] = !!checked.isLocalMask;
    state.scaleApprovals[ci] = false;
    if (!state.palette && checked.palette) state.palette = checked.palette;
    state.overflow = state.overflow.filter(function(i){ return i !== ci; });
    if (checked.blocked) {
      state.overflow.push(ci);
      state.overflow.sort(function(a, b){ return a - b; });
    }
    if (!lastNativeStats) {
      lastNativeStats = {
        size: state.pp.size, availH: state.pp.size - 1 - state.pp.footMargin, availW: state.pp.size - 2,
        snappedCount: 0, maxNativeH: 0, downscaledCount: 0, baseline: checked.frameStat.foot, frames: []
      };
    }
    var others = lastNativeStats.frames.filter(function(f){ return f.index !== ci; });
    others.push(checked.frameStat);
    others.sort(function(a, b){ return a.index - b.index; });
    lastNativeStats.frames = others;
    lastNativeStats.snappedCount = others.filter(function(f){ return f.coherence > 0; }).length;
    lastNativeStats.downscaledCount = others.filter(function(f){ return f.scale < 1; }).length;
    lastNativeStats.maxNativeH = others.reduce(function(m, f){ return Math.max(m, f.bh); }, 0);
    window.__lastNativeStats = lastNativeStats;
  }

  function setEditorRedrawState(msg, isErr, active){
    var bar = $('editorRedrawBar');
    if (!bar) return;
    bar.hidden = !msg;
    bar.classList.toggle('error', !!isErr);
    $('editorRedrawStatus').textContent = msg || '';
    $('btnStopRedraw').hidden = !active;
  }

  function syncGeneratingButtons(){
    $('btnGenSheet12').disabled = generating;
    $('btnGenOneDir').disabled = generating;
    $('btnStopGen').disabled = !generating;
    if ($('btnRedrawFrame')) {
      $('btnRedrawFrame').disabled = generating;
      $('btnRedrawFrame').textContent = generating ? '重画中…' : (editMaskHas ? '按遮罩重画' : '重画这一帧');
    }
    document.querySelectorAll('#sheetNativeWarn button').forEach(function(b){ b.disabled = generating; });
  }

  function redrawSingleFrame(cellIndex, opts){
    if (generating) return Promise.resolve();
    opts = opts || {};
    syncStateFromInputs();
    if (!state.rawSheet && !state.rawFrames.some(Boolean) && !state.frames.some(Boolean)) {
      toast('请先生成或导入至少一帧');
      return Promise.resolve();
    }
    var row = Math.floor(cellIndex / 3), col = cellIndex % 3;
    var baseBody = getSelectedBaseBody();
    var hasBaseBody = !!baseBody;
    var localMaskCanvas = opts.localMaskCanvas || null;
    var baseFrameDataUrl = opts.baseFrameDataUrl || '';
    var localMaskDataUrl = localMaskCanvas ? localMaskCanvas.toDataURL('image/png') : '';
    var isOverflow = state.overflow.indexOf(cellIndex) >= 0;

    generating = true;
    syncGeneratingButtons();
    setProgress(1, 3);
    var label = '正在重画第 ' + (cellIndex + 1) + ' 帧（' + DIRS[row] + '·' + STEP_LABEL[col] + (localMaskCanvas ? '·局部遮罩' : '') + '）…';
    setStatus(label);
    if (opts.fromEditor) setEditorRedrawState(label, false, true);

    var prepInputs = composeSheetAndMaskForCell(cellIndex, localMaskCanvas, baseFrameDataUrl);
    var prepBody = hasBaseBody
      ? prepareBaseBodyDataUrl(baseBody.dataUrl, state.pp.size, null)
      : Promise.resolve('');

    return Promise.all([prepInputs, prepBody]).then(function(res){
      var built = res[0], bodyImg = res[1];
      var prompt = buildSingleCellPrompt(cellIndex, {
        hasBaseBody: hasBaseBody,
        isOverflow: isOverflow && !localMaskCanvas,
        maskRegionDesc: built.maskRegionDesc,
        note: opts.note || ''
      });
      return callCellRedrawApi({
        sheetImage: built.sheetDataUrl,
        maskImage: built.maskDataUrl,
        bodyImage: bodyImg,
        prompt: prompt
      });
    }).then(function(variants){
      setProgress(2, 3);
      state.variants = variants.map(function(v){
        v.targetMode = 'cell';
        v.targetCell = cellIndex;
        v.useBodyGrid = hasBaseBody;
        v.localMaskDataUrl = localMaskDataUrl;
        v.baseFrameDataUrl = baseFrameDataUrl;
        return v;
      });
      return rankVariants();
    }).then(function(){
      setProgress(3, 3);
      if (opts.fromEditor) {
        var stillOver = state.overflow.indexOf(cellIndex) >= 0;
        setEditorRedrawState(stillOver ? '新帧仍超限，可再次重画' : '', stillOver, false);
      }
    }).catch(function(e){
      setStatus('重画失败：' + e.message, true);
      if (opts.fromEditor) setEditorRedrawState('重画失败：' + e.message, true, false);
      toast('重画失败：' + e.message, 3800);
    }).finally(function(){
      generating = false;
      syncGeneratingButtons();
    });
  }

  // -------------------------------------------------------------------------
  // 变体选择、拆帧池与 3×4 格子渲染 / 分配
  // -------------------------------------------------------------------------
  function renderVariants(){
    var card = $('variantCard'), grid = $('variantGrid');
    $('variantCount').textContent = String(state.variants.length);
    card.hidden = state.variants.length <= 1;
    grid.innerHTML = '';
    for (var i = 0; i < state.variants.length; i++) {
      (function(idx){
        var v = state.variants[idx];
        var el = document.createElement('div');
        var unusable = v.score == null && !v.usable;
        el.className = 'variant-item' + (state.selectedVariant === idx ? ' selected' : '') + (unusable ? ' unusable' : '');
        var label = v.score != null ? v.score + ' 分' : v.usable ? '超限' : '不可用';
        var tagCls = v.score != null ? 'good' : v.usable ? 'warn' : 'muted';
        el.innerHTML = '<img src="' + (v.gifSrc || v.pngSrc) + '" alt=""><span class="vtag ' + tagCls + '">#' + (idx + 1) + ' · ' + label + '</span>';
        el.addEventListener('click', function(){ applyVariant(idx); });
        grid.appendChild(el);
      })(i);
    }
  }

  function evaluateVariant(v){
    if (v.targetMode === 'cell') {
      return evaluateSingleCellVariant(v).catch(function(){ return null; });
    }
    var all = v.targetMode === 'all';
    var first = all ? 0 : (v.targetDir || 0) * 3;
    var count = all ? 12 : 3;
    var indices = Array.from({ length: count }, function(_, i){ return first + i; });
    return extractVariantFrames(v, v.expect4x3).then(function(frames){
      if (all ? frames.length !== 12 : frames.length !== 3 && frames.length !== 4) return null;
      var gid = nextSourceId();
      var input = {
        rawFrames: all ? new Array(12).fill('') : state.rawFrames.slice(),
        frames: all ? new Array(12).fill('') : state.frames.slice(),
        sources: all ? new Array(12).fill('') : state.sources.slice(),
        bodyCellHeights: all ? {} : Object.assign({}, state.bodyCellHeights),
        edited: all ? new Array(12).fill(false) : state.edited.slice(),
        scaleApprovals: all ? new Array(12).fill(false) : state.scaleApprovals.slice()
      };
      // Projection cuts find clear crop boundaries. The pitch comes from
      // the nominal panels so all poses use one scale despite uneven margins.
      if (v.useBodyGrid) input.bodyCellHeights[gid] = frames.sheetMeta ? frames.sheetMeta.h / 4 : frames.cellHeight;
      indices.forEach(function(i, j){
        input.rawFrames[i] = frames[j];
        input.sources[i] = gid;
        input.edited[i] = false;
        input.scaleApprovals[i] = false;
      });
      return processFrames(input, Object.assign({}, state.pp), all ? null : state.palette).then(function(result){
        var checks = result.output;
        var missing = indices.some(function(i){ return checks.empty.indexOf(i) >= 0; });
        var wrongSize = checks.wrongSize.some(function(i){ return result.overflow.indexOf(i) < 0; });
        if (missing || wrongSize || checks.softAlpha.length) return null;
        if (!result.overflow.length && checks.overBudget) return null;
        var data = result.stats.frames.filter(function(frame){ return indices.indexOf(frame.index) >= 0; });
        function average(list){ return list.reduce(function(sum, x){ return sum + x; }, 0) / Math.max(1, list.length); }
        function range(list){ return Math.max.apply(null, list) - Math.min.apply(null, list); }
        var grid = average(data.map(function(frame){ return frame.coherence; }));
        var fidelity = average(data.map(function(frame){ return frame.fidelity; }));
        var stability = [];
        for (var j = 0; j < data.length; j += 3) {
          var row = data.slice(j, j + 3);
          var jitter = range(row.map(function(f){ return f.bh; })) +
            range(row.map(function(f){ return f.center; })) + range(row.map(function(f){ return f.foot; }));
          stability.push(Math.max(0, 1 - jitter / (state.pp.size * 0.35)));
        }
        var score = Math.round(100 * (grid * 0.4 + fidelity * 0.35 + average(stability) * 0.25));
        return { result: result, input: input, source: gid, pool: frames,
          sheetSrc: all && v.pngSrc ? v.pngSrc : '', sheetMeta: all && frames.sheetMeta ? frames.sheetMeta : null,
          score: score, eligible: !result.overflow.length && !(state.pp.pixelSnap && data.some(function(f){ return f.scale < 1; })) };
      });
    }).catch(function(){ return null; });
  }

  function rankVariants(){
    var variants = state.variants;
    var best = null, bestIndex = -1;
    state.selectedVariant = -1;
    setStatus('正在比较生成变体…');
    // Keep evaluation sequential so large generated sheets do not decode at once.
    return variants.reduce(function(chain, variant, index){
      return chain.then(function(){
        return evaluateVariant(variant).then(function(evaluation){
          variant.score = evaluation && evaluation.eligible ? evaluation.score : null;
          variant.usable = !!evaluation;
          return evaluation;
        }).then(function(evaluation){
          if (!evaluation) return;
          if (!best || (evaluation.eligible && !best.eligible) ||
              (evaluation.eligible === best.eligible && (evaluation.result.overflow.length < best.result.overflow.length ||
                (evaluation.result.overflow.length === best.result.overflow.length && evaluation.score > best.score)))) {
            best = evaluation;
            bestIndex = index;
          }
        });
      });
    }, Promise.resolve()).then(function(){
      renderVariants();
      if (!best) throw new Error('没有可用的变体');
      return applyVariant(bestIndex, best);
    });
  }

  function applyVariant(idx, evaluation){
    var v = state.variants[idx];
    if (!v || !v.usable) return Promise.resolve();
    var finish = async function(checked){
      if (!checked) { setStatus('这个变体无法使用', true); return; }
      state.selectedVariant = idx;
      if (checked.targetMode === 'cell') {
        commitSingleCellResult(checked);
        await refreshBodyLocks([Math.floor(checked.cellIndex / 3)]);
        renderVariants(); renderGrid(); saveLocal();
        if ($('editorDialog').open && editIndex === checked.cellIndex) {
          refreshEditorAfterRedraw(checked.cellIndex, checked);
        }
        setStatus('已重画第 ' + (checked.cellIndex + 1) + ' 帧' + (checked.blocked ? '（仍超限）' : ''));
        toast(checked.blocked ? '新帧仍超限，可再次重画' : '第 ' + (checked.cellIndex + 1) + ' 帧已更新');
        return;
      }
      state.pool = checked.pool;
      state.poolSources = checked.pool.map(function(){ return checked.source; });
      selectedPoolIndex = -1;
      state.rawFrames = checked.input.rawFrames;
      state.sources = checked.input.sources;
      state.edited = checked.input.edited;
      state.scaleApprovals = checked.input.scaleApprovals;
      if (checked.sheetSrc) {
        state.rawSheet = checked.sheetSrc;
        state.rawSheetCuts = checked.sheetMeta;
        state.rawSheetCells = state.rawFrames.slice();
      }
      await commitProcessed(checked.result, v.targetMode === 'row' ? [v.targetDir || 0] : null);
      renderVariants(); renderPool(); renderGrid(); saveLocal();
      setStatus('已应用变体 #' + (idx + 1));
      toast(state.overflow.length ? '请处理超限帧' : '处理完成');
    };
    return evaluation ? Promise.resolve(finish(evaluation)) : evaluateVariant(v).then(finish);
  }

  function renderPool(){
    var card = $('poolCard');
    var grid = $('poolGrid');
    $('poolCount').textContent = String(state.pool.length);
    card.hidden = state.pool.length === 0;
    grid.innerHTML = '';
    for (var i = 0; i < state.pool.length; i++) {
      (function(idx){
        var item = document.createElement('div');
        item.className = 'pool-item' + (selectedPoolIndex === idx ? ' selected' : '');
        item.draggable = true;
        item.innerHTML = '<img src="' + state.pool[idx] + '" alt=""><span class="pidx">#' + (idx + 1) + '</span>';
        item.addEventListener('dragstart', function(e){
          e.dataTransfer.setData('text/plain', String(idx));
          selectedPoolIndex = idx;
        });
        item.addEventListener('click', function(){
          selectedPoolIndex = (selectedPoolIndex === idx) ? -1 : idx;
          renderPool();
          renderGrid();
        });
        grid.appendChild(item);
      })(i);
    }
    var selStat = $('poolSelectionStatus');
    if (selectedPoolIndex >= 0 && state.pool[selectedPoolIndex]) {
      selStat.hidden = false;
      selStat.textContent = '已选中第 #' + (selectedPoolIndex + 1) + ' 帧，点击右侧 3×4 任意格子即可填入（再次点击该帧取消）';
    } else {
      selStat.hidden = true;
    }
  }

  function assignPoolFrameToCell(poolIdx, cellIdx){
    if (!state.pool[poolIdx]) return;
    state.rawFrames[cellIdx] = state.pool[poolIdx];
    state.scaleApprovals[cellIdx] = false;
    state.sources[cellIdx] = state.poolSources[poolIdx] || nextSourceId();
    state.edited[cellIdx] = false;
    selectedPoolIndex = -1;
    renderPool();
    setStatus('正在统一处理并对齐帧…');
    runPostProcess().then(function(){
      renderGrid(); saveLocal();
      setStatus('已填入第 ' + (cellIdx + 1) + ' 格并完成统一对齐');
      toast('已填入 ' + DIRS[Math.floor(cellIdx / 3)] + '·' + STEP_LABEL[cellIdx % 3]);
    });
  }

  function renderGrid(){
    var grid = $('sheetGrid');
    if (!grid.children.length) {
      var corner = document.createElement('div'); corner.className = 'corner'; grid.appendChild(corner);
      for (var c = 0; c < 3; c++) {
        var ch = document.createElement('div'); ch.className = 'colhead'; ch.textContent = STEP_LABEL[c]; grid.appendChild(ch);
      }
      for (var r = 0; r < 4; r++) {
        var rh = document.createElement('div'); rh.className = 'rowhead'; rh.textContent = DIRS[r]; grid.appendChild(rh);
        for (var cc = 0; cc < 3; cc++) {
          var idx = r * 3 + cc;
          var cell = document.createElement('div');
          cell.className = 'cell'; cell.dataset.index = String(idx); cell.tabIndex = 0;
          cell.innerHTML = '<img alt=""><span class="badge empty">空</span><span class="idx">' + (idx + 1) + '</span>';
          cell.addEventListener('click', function(){
            var ci = Number(this.dataset.index);
            if (selectedPoolIndex >= 0 && state.pool[selectedPoolIndex]) {
              assignPoolFrameToCell(selectedPoolIndex, ci);
            } else {
              openEditor(ci);
            }
          });
          cell.addEventListener('dragover', function(e){ e.preventDefault(); this.classList.add('drag-over'); });
          cell.addEventListener('dragleave', function(){ this.classList.remove('drag-over'); });
          cell.addEventListener('drop', function(e){
            e.preventDefault();
            this.classList.remove('drag-over');
            var pIdx = Number(e.dataTransfer.getData('text/plain'));
            if (Number.isFinite(pIdx) && state.pool[pIdx]) {
              assignPoolFrameToCell(pIdx, Number(this.dataset.index));
            }
          });
          grid.appendChild(cell);
        }
      }
    }

    var cells = grid.querySelectorAll('.cell');
    var assignMode = selectedPoolIndex >= 0;
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      cell.classList.toggle('assign-target', assignMode);
      var isOverflow = state.overflow.indexOf(i) >= 0;
      cell.classList.toggle('overflow', isOverflow);
      var im = cell.querySelector('img');
      var badge = cell.querySelector('.badge');
      badge.title = '';
      var frame = state.frames[i];
      if (isOverflow) {
        im.src = frame; im.classList.remove('ghost');
        badge.textContent = '超限'; badge.className = 'badge warn';
      } else if (frame) {
        im.src = frame; im.classList.remove('ghost');
        var suggest = state.lockResults[i] && state.lockResults[i].suggested && !state.edited[i];
        badge.textContent = suggest ? '建议重画' : state.edited[i] ? STEP_LABEL[i % 3] + '·手修' : STEP_LABEL[i % 3];
        badge.className = suggest ? 'badge warn' : 'badge';
        if (suggest) badge.title = '建议重画这一帧';
      } else {
        im.src = templateReady ? templateFrameUrl(i, state.pp.size) : '';
        im.classList.add('ghost');
        badge.textContent = '空'; badge.className = 'badge empty';
      }
    }

    var filled = state.frames.filter(Boolean).length;
    var sz = state.pp.size;
    $('sheetInfo').textContent = filled + ' / 12 帧 · 单帧 ' + sz + '×' + sz + ' · 输出 ' + (sz * 3) + '×' + (sz * 4);
    updateNativeWarn();
    refreshPreviewImages();
  }

  // -------------------------------------------------------------------------
  // 动画预览（MZ 顺序：左步 -> 站 -> 右步 -> 站）
  // -------------------------------------------------------------------------
  function refreshPreviewImages(){
    for (var i = 0; i < 12; i++) {
      if (!state.frames[i]) { previewImgs[i] = null; continue; }
      (function(idx, src){
        var im = new Image();
        im.onload = function(){ previewImgs[idx] = im; drawPreview(); };
        im.src = src;
      })(i, state.frames[i]);
    }
    drawPreview();
  }

  function drawPreview(){
    var c = $('previewCanvas');
    var sz = state.pp.size;
    var displaySize = sz * previewZoom;
    if (c.width !== sz || c.height !== sz) { c.width = sz; c.height = sz; }
    c.style.width = displaySize + 'px';
    c.style.height = displaySize + 'px';
    var ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, sz, sz);
    var col = MZ_PLAY_SEQ[previewStepPos % MZ_PLAY_SEQ.length];
    var idx = previewDir * 3 + col;
    var im = previewImgs[idx];
    if (im && im.complete) {
      ctx.drawImage(im, 0, 0, sz, sz);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.fillRect(0, 0, sz, sz);
    }
    $('previewMeta').textContent = DIRS[previewDir] + ' · ' + STEP_LABEL[col] + ' · ' + previewZoom + '× 缩放';
  }

  function startPreview(){
    stopPreview();
    var ms = Math.max(60, Math.min(1000, Number($('previewSpeed').value) || 180));
    previewTimer = setInterval(function(){
      previewStepPos = (previewStepPos + 1) % MZ_PLAY_SEQ.length;
      drawPreview();
    }, ms);
    $('btnPlay').textContent = '暂停';
  }
  function stopPreview(){
    if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
    $('btnPlay').textContent = '播放';
  }

  // -------------------------------------------------------------------------
  // 左/右行镜像
  // -------------------------------------------------------------------------
  function flipDataUrlH(src){
    return loadImg(src).then(function(im){
      var c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      var ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
      ctx.translate(c.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(im, 0, 0);
      return c.toDataURL('image/png');
    });
  }

  function mirrorRow(fromRow, toRow, silent){
    var mapCols = [2, 1, 0];
    var tasks = [];
    for (var c = 0; c < 3; c++) {
      (function(col){
        var srcIdx = fromRow * 3 + mapCols[col];
        var dstIdx = toRow * 3 + col;
        var pFrame = state.frames[srcIdx] ? flipDataUrlH(state.frames[srcIdx]) : Promise.resolve('');
        var pRaw = state.rawFrames[srcIdx] ? flipDataUrlH(state.rawFrames[srcIdx]) : Promise.resolve('');
        var pUnlocked = state.unlockedFrames[srcIdx] ? flipDataUrlH(state.unlockedFrames[srcIdx]) : pFrame;
        tasks.push(Promise.all([pFrame, pRaw, pUnlocked]).then(function(res){
          state.frames[dstIdx] = res[0];
          state.rawFrames[dstIdx] = res[1];
          state.unlockedFrames[dstIdx] = res[2];
          state.lockResults[dstIdx] = null;
          state.scaleApprovals[dstIdx] = state.scaleApprovals[srcIdx];
          state.overflow = state.overflow.filter(function(i){ return i !== dstIdx; });
          if (state.overflow.indexOf(srcIdx) >= 0) state.overflow.push(dstIdx);
          state.sources[dstIdx] = state.sources[srcIdx];
          state.edited[dstIdx] = false;
        }));
      })(c);
    }
    return Promise.all(tasks).then(function(){
      renderGrid(); saveLocal();
      if (!silent) toast('已从' + DIRS[fromRow] + '行水平镜像生成' + DIRS[toRow] + '行');
    });
  }

  // -------------------------------------------------------------------------
  // 逐帧像素编辑器
  // -------------------------------------------------------------------------
  function isEditorOverflow(){
    return state.overflow.indexOf(editIndex) >= 0;
  }

  function clearEditMask(){
    var mc = $('editMaskCanvas');
    if (mc) mc.getContext('2d').clearRect(0, 0, mc.width, mc.height);
    editMaskHas = false;
    if ($('btnClearMask')) $('btnClearMask').disabled = true;
    syncGeneratingButtons();
  }

  function syncEditMaskState(){
    var mc = $('editMaskCanvas');
    var has = false;
    if (mc) {
      var d = mc.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, mc.width, mc.height).data;
      for (var i = 3; i < d.length; i += 4) {
        if (d[i] > 0) { has = true; break; }
      }
    }
    editMaskHas = has;
    if ($('btnClearMask')) $('btnClearMask').disabled = !has || isEditorOverflow();
    syncGeneratingButtons();
  }

  function applyEditorMode(index){
    var sz = state.pp.size;
    var over = state.overflow.indexOf(index) >= 0;
    var stat = lastNativeStats && lastNativeStats.frames
      ? lastNativeStats.frames.find(function(f){ return f.index === index; })
      : null;
    $('editorSub').textContent = over && stat
      ? ('超限 ' + stat.bw + ' × ' + stat.bh + '（上限 ' + sz + ' × ' + sz + '）')
      : ('尺寸 ' + sz + ' × ' + sz);

    ['btnMaskBrush','btnMaskEraser','btnUndo','btnNudgeLeft','btnNudgeUp','btnNudgeDown','btnNudgeRight',
     'btnFlipFrame','btnApplyTemplate','btnClearFrame','btnSaveFrame'].forEach(function(id){
      if ($(id)) $(id).disabled = over;
    });
    document.querySelectorAll('[data-tool="brush"],[data-tool="eraser"],[data-tool="eyedrop"]').forEach(function(b){
      b.disabled = over;
    });
    $('btnStampItem').disabled = over || !state.itemRef;
    $('btnReprocessFrame').disabled = !state.rawFrames[index];
    $('btnClearMask').disabled = over || !editMaskHas;
    $('copyRowBtns').querySelectorAll('button').forEach(function(b){
      b.disabled = over || !state.frames[Number(b.dataset.srcIdx)];
    });
    syncGeneratingButtons();
  }

  function refreshEditorAfterRedraw(index, checked){
    var sz = state.pp.size;
    var c = $('editCanvas'), mc = $('editMaskCanvas');
    var ctx = c.getContext('2d');
    var over = state.overflow.indexOf(index) >= 0;
    if (!checked.isLocalMask) {
      editUndo = [];
      editModified = false;
    } else {
      pushEditUndo();
      editModified = true;
    }
    clearEditMask();
    applyEditorMode(index);
    var src = state.frames[index];
    if (!src) return;
    loadImg(src).then(function(im){
      var w = over ? im.width : sz, h = over ? im.height : sz;
      c.width = w; c.height = h;
      mc.width = w; mc.height = h;
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(im, 0, 0, w, h);
    });
  }

  function openEditor(index){
    editIndex = index;
    var row = Math.floor(index / 3), col = index % 3;
    var sz = state.pp.size;
    var over = state.overflow.indexOf(index) >= 0;
    $('editorTitle').textContent = '编辑第 ' + (index + 1) + ' 帧 · ' + DIRS[row] + ' · ' + STEP_LABEL[col];

    var c = $('editCanvas'), mc = $('editMaskCanvas');
    c.width = sz; c.height = sz;
    mc.width = sz; mc.height = sz;
    var ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, sz, sz);
    editUndo = [];
    editStamp = false;
    editModified = false;
    clearEditMask();
    $('redrawNote').value = '';
    setEditorRedrawState('', false, false);
    setEditTool('brush');
    $('btnStampItem').classList.remove('on');

    var copyBox = $('copyRowBtns');
    copyBox.innerHTML = '';
    for (var k = 0; k < 3; k++) {
      if (k === col) continue;
      (function(srcCol){
        var srcIdx = row * 3 + srcCol;
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'tool';
        b.dataset.srcIdx = String(srcIdx);
        b.textContent = '复制 ' + STEP_LABEL[srcCol];
        b.disabled = over || !state.frames[srcIdx];
        b.addEventListener('click', function(){
          var src = state.frames[srcIdx];
          if (!src || isEditorOverflow()) return;
          pushEditUndo();
          editModified = true;
          loadImg(src).then(function(im){
            ctx.clearRect(0, 0, sz, sz);
            ctx.drawImage(im, 0, 0, sz, sz);
          });
        });
        copyBox.appendChild(b);
      })(k);
    }

    applyEditorMode(index);

    var src = state.frames[index] || (templateReady ? templateFrameUrl(index, sz) : '');
    if (src) {
      loadImg(src).then(function(im){
        var w = over ? im.width : sz, h = over ? im.height : sz;
        c.width = w; c.height = h;
        mc.width = w; mc.height = h;
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(im, 0, 0, w, h);
      });
    }
    if (!$('editorDialog').open) $('editorDialog').showModal();
  }

  function setEditTool(t){
    editTool = t;
    if (t) editStamp = false;
    document.querySelectorAll('[data-tool]').forEach(function(b){
      b.classList.toggle('on', b.dataset.tool === t);
    });
    if (t) $('btnStampItem').classList.remove('on');
  }

  function pushEditUndo(){
    var c = $('editCanvas'), ctx = c.getContext('2d');
    editUndo.push(ctx.getImageData(0, 0, c.width, c.height));
    if (editUndo.length > 30) editUndo.shift();
  }

  function editPoint(e){
    var c = $('editCanvas'), r = c.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * c.width / Math.max(1, r.width),
      y: (e.clientY - r.top) * c.height / Math.max(1, r.height)
    };
  }

  function pickColorAt(p){
    var c = $('editCanvas'), ctx = c.getContext('2d');
    var x = Math.max(0, Math.min(c.width - 1, Math.floor(p.x)));
    var y = Math.max(0, Math.min(c.height - 1, Math.floor(p.y)));
    var d = ctx.getImageData(x, y, 1, 1).data;
    if (d[3] < 16) { toast('此处为透明像素'); return; }
    var hex = '#' + [d[0], d[1], d[2]].map(function(v){ return v.toString(16).padStart(2, '0'); }).join('');
    $('editColor').value = hex;
    setEditTool('brush');
    toast('已取色 ' + hex.toUpperCase());
  }

  function drawAt(p){
    var brush = Number($('editBrush').value) || 1;
    var x = Math.floor(p.x), y = Math.floor(p.y);
    if (editTool === 'mask' || editTool === 'maskEraser') {
      var mc = $('editMaskCanvas'), mctx = mc.getContext('2d');
      mctx.globalCompositeOperation = editTool === 'maskEraser' ? 'destination-out' : 'source-over';
      mctx.fillStyle = '#c64b32';
      mctx.fillRect(x - Math.floor(brush / 2), y - Math.floor(brush / 2), brush, brush);
      mctx.globalCompositeOperation = 'source-over';
      return;
    }
    var c = $('editCanvas'), ctx = c.getContext('2d');
    ctx.globalCompositeOperation = editTool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.fillStyle = $('editColor').value;
    ctx.fillRect(x - Math.floor(brush / 2), y - Math.floor(brush / 2), brush, brush);
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawLine(a, b){
    var n = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y), 1);
    for (var i = 0; i <= n; i++) {
      drawAt({ x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n });
    }
  }

  function nudgeEditor(dx, dy){
    var c = $('editCanvas'), ctx = c.getContext('2d');
    pushEditUndo();
    editModified = true;
    var tmp = document.createElement('canvas'); tmp.width = c.width; tmp.height = c.height;
    tmp.getContext('2d').drawImage(c, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(tmp, dx, dy);
  }

  function stampItemAt(p){
    if (!state.itemRef) return;
    pushEditUndo();
    editModified = true;
    loadImg(state.itemRef).then(function(im){
      var c = $('editCanvas'), ctx = c.getContext('2d');
      var target = Math.max(8, Math.round(c.width * 0.32));
      var sc = Math.min(target / im.width, target / im.height);
      var w = Math.max(1, Math.round(im.width * sc)), h = Math.max(1, Math.round(im.height * sc));
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(im, Math.round(p.x - w / 2), Math.round(p.y - h / 2), w, h);
    });
  }

  // -------------------------------------------------------------------------
  // 导出 PNG & 工程 JSON
  // -------------------------------------------------------------------------
  function downloadBlob(blob, name){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  }

  function exportSheetPng(){
    if (state.overflow.length) { toast('请先处理超限帧'); return; }
    var sz = state.pp.size;
    var c = document.createElement('canvas');
    c.width = sz * 3; c.height = sz * 4;
    var ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;

    var tasks = [];
    for (var i = 0; i < 12; i++) {
      if (!state.frames[i]) continue;
      (function(idx, src){
        tasks.push(loadImg(src).then(function(im){
          var col = idx % 3, row = Math.floor(idx / 3);
          if (im.width !== sz || im.height !== sz) throw new Error('有帧尺寸不匹配，请先重新处理');
          ctx.drawImage(im, col * sz, row * sz);
        }));
      })(i, state.frames[i]);
    }
    Promise.all(tasks).then(function(){
      binaryAlpha(c, state.pp.alphaThresh);
      var output = inspectOutput([c], state.pp);
      if (output.softAlpha.length) throw new Error('PNG 含半透明像素');
      if (output.overBudget) throw new Error('整表超过色板色数，请重新处理或调整手修颜色');
      c.toBlob(function(blob){
        if (!blob) return;
        var name = ($('mzPrefix').checked ? '$' : '') + 'character_walk_' + sz + '.png';
        downloadBlob(blob, name);
        toast('已导出 ' + name + ' (' + c.width + '×' + c.height + ')');
      }, 'image/png');
    }).catch(function(e){ toast(e.message); });
  }

  function exportProjectJson(){
    var data = {
      format: 'rm-walk-project@2',
      frames: state.frames,
      unlockedFrames: state.unlockedFrames,
      rawFrames: state.rawFrames,
      sources: state.sources,
      bodyCellHeights: state.bodyCellHeights,
      edited: state.edited,
      overflow: state.overflow,
      scaleApprovals: state.scaleApprovals,
      palette: state.palette,
      charRef: state.charRef,
      baseBodyId: state.baseBodyId,
      customBaseBody: state.customBaseBody,
      itemRef: state.itemRef,
      charDesc: state.charDesc,
      styleDesc: state.styleDesc,
      aiModel: state.aiModel,
      aiBgType: state.aiBgType,
      aiDir: state.aiDir,
      seqDuration: state.seqDuration,
      seqSize: state.seqSize,
      seqQuality: state.seqQuality,
      mzPrefix: state.mzPrefix,
      pp: state.pp
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'rm-walk-project-v2.json');
    toast('工程已导出（不含 API Key）');
  }

  // -------------------------------------------------------------------------

    state.charDesc = $('charDesc').value.trim();
    state.styleDesc = $('styleDesc').value.trim();
    state.aiModel = $('aiModel').value.trim() || API_SPEC.defaultModel;
    state.aiBgType = $('aiBgType').value;

    $('charDesc').value = state.charDesc;

  function handleImportedFrames(frames, groupId){
    var gid = groupId || nextSourceId();
    state.pool = frames.slice();
    state.poolSources = frames.map(function(){ return gid; });
    selectedPoolIndex = -1;
    renderPool();

    var target = $('impTarget').value;
    if (target === 'pool') {
      setStatus('已拆出 ' + frames.length + ' 帧到待分配帧池');
      toast('已拆出 ' + frames.length + ' 帧');
      return Promise.resolve();
    }

    if (target.indexOf('row:') === 0) {
      var dir = Number(target.split(':')[1]) || 0;
      for (var c = 0; c < 3 && c < frames.length; c++) {
        state.rawFrames[dir * 3 + c] = frames[c];
        state.scaleApprovals[dir * 3 + c] = false;
        state.sources[dir * 3 + c] = gid;
        state.edited[dir * 3 + c] = false;
      }
    } else {
      for (var i = 0; i < 12 && i < frames.length; i++) {
        state.rawFrames[i] = frames[i];
        state.scaleApprovals[i] = false;
        state.sources[i] = gid + '_r' + Math.floor(i / 3);
        state.edited[i] = false;
      }
    }

    setStatus('正在执行像素格还原、对齐与量化…');
    return runPostProcess().then(function(){
      renderGrid(); saveLocal();
      setStatus('导入完成：拆出 ' + frames.length + ' 帧并完成统一后处理');
      toast('导入并处理完成');
    });
  }

    $('fileCharRef').addEventListener('change', function(){

        state.charRef = url;
        applyStateToInputs();
        toast('已载入角色参考图');

      e.stopPropagation();

      if (!f) return;
      readFileAsDataUrl(f).then(function(url){
        return loadImg(url).then(function(im){
          if (im.naturalWidth !== 144 || im.naturalHeight !== 192) {
            toast('素体尺寸需为 144×192（当前 ' + im.naturalWidth + '×' + im.naturalHeight + '）', 3600);

          }
          setCustomBaseBody(url);
          toast('已载入自定义素体');

      });

    $('btnImportItemRef').addEventListener('click', function(){ $('fileItemRef').click(); });

    $('fileItemRef').addEventListener('change', function(){
      var f = this.files && this.files[0]; this.value = '';
      if (!f) return;
      readFileAsDataUrl(f).then(function(url){
        state.itemRef = url;
        toast('已载入贴图物品，可在帧编辑器的“贴物品”中使用');
      });
    });

    // 主路线：一次生成全部 12 帧
    function startGeneration(mode){
      if (generating) return;
      syncStateFromInputs();
      var isAll = mode === 'all';
      var dirIdx = state.aiDir;
      var refImg = isAll ? state.charRef : (state.rawFrames[1] || state.frames[1] || state.charRef);
      var baseBody = getSelectedBaseBody();
      var hasBaseBody = !!baseBody;
      var hasCharRef = !!refImg;
      var via = (hasCharRef || hasBaseBody) ? 'edits' : 'generations';
      var prompt = isAll ? buildSheet12Prompt(hasBaseBody, hasCharRef) : buildDir4Prompt(dirIdx, hasBaseBody, hasCharRef);
      var fc = isAll ? API_SPEC.seqParams.sheet_frame_count : API_SPEC.seqParams.dir_frame_count;

      generating = true;
      syncGeneratingButtons();
      setProgress(1, 3);
      setStatus((isAll ? '正在一次生成 12 帧' : '正在重做「' + DIRS[dirIdx] + '」方向') + (hasBaseBody ? ' · ' + baseBody.name : '') + ' (' + via + ')…');

      var prepBody = hasBaseBody
        ? prepareBaseBodyDataUrl(baseBody.dataUrl, state.pp.size, isAll ? null : dirIdx)
        : Promise.resolve('');

      prepBody.then(function(bodyImg){
        return callSequenceApi({ refImage: refImg, bodyImage: bodyImg, prompt: prompt, frameCount: fc });
      }).then(function(variants){
        setProgress(2, 3);
        state.variants = variants.map(function(v){
          v.targetMode = isAll ? 'all' : 'row';
          v.targetDir = dirIdx;
          v.expect4x3 = isAll;
          v.useBodyGrid = hasBaseBody;
          return v;
        });
        return rankVariants();
      }).then(function(){
        setProgress(3, 3);
      }).catch(function(e){
        setStatus('生成失败：' + e.message, true);
        toast('生成失败：' + e.message, 3800);
      }).finally(function(){
        generating = false;
        syncGeneratingButtons();
      });
    }

    $('btnGenSheet12').addEventListener('click', function(){ startGeneration('all'); });
    $('btnGenOneDir').addEventListener('click', function(){ startGeneration('dir'); });
    $('btnStopGen').addEventListener('click', function(){ if (abortCtrl) abortCtrl.abort(); });

    // 暴露多变体解析测试入口（供离线测试注入模拟多变体响应，不影响正常页面操作）
    window.__applyMockVariants = function(rawItems, opts){
      opts = opts || {};
      return Promise.all(rawItems.map(resolveItemPayload)).then(groupResponseVariants).then(function(variants){
        state.variants = variants.map(function(v){
          v.targetMode = opts.targetMode || 'row';
          v.targetDir = opts.targetDir || 0;
          v.targetCell = typeof opts.targetCell === 'number' ? opts.targetCell : 0;
          v.localMaskDataUrl = opts.localMaskDataUrl || '';
          v.baseFrameDataUrl = opts.baseFrameDataUrl || '';
          v.expect4x3 = !!opts.expect4x3;
          v.useBodyGrid = !!getSelectedBaseBody();
          return v;
        });
        return rankVariants().then(function(){ return state.variants.length; });
      });
    };

    // 直接导入
    $('fileDirectImport').addEventListener('change', function(){
      var f = this.files && this.files[0]; this.value = '';
      if (!f) return;
      syncStateFromInputs();
      var isGif = /\.gif$/i.test(f.name) || f.type === 'image/gif';
      var splitMode = $('impSplitMode').value;
      var rows = Number($('impRows').value) || 4;
      var cols = Number($('impCols').value) || 3;
      var impGid = nextSourceId();
      var target = $('impTarget').value;
      $('impFileLabel').textContent = f.name;
      setStatus('正在读取并拆帧…');
      if (isGif) {
        readFileAsBuffer(f).then(decodeGifBuffer).then(function(frames){ return handleImportedFrames(frames, impGid); }).catch(function(e){
          setStatus('GIF 导入失败：' + e.message, true);
          toast('导入失败：' + e.message, 3600);
        });
      } else {
        var importedUrl = '';
        readFileAsDataUrl(f).then(function(url){
          importedUrl = url;
          if (splitMode === 'grid') return splitSheetGrid(url, rows, cols);
          if (target === 'all') return splitSheetAuto(url, state.pp.bgMode, state.pp.bgTol, 4, 3);
          return splitSheetAuto(url, state.pp.bgMode, state.pp.bgTol);
        }).then(function(frames){
          return handleImportedFrames(frames, impGid).then(function(){
            if (target === 'all' && frames.length === 12) {
              state.rawSheet = importedUrl;
              state.rawSheetCuts = frames.sheetMeta || null;
              state.rawSheetCells = state.rawFrames.slice();
            }
          });
        }).catch(function(e){
          setStatus('图片导入失败：' + e.message, true);
          toast('导入失败：' + e.message, 3600);
        });
      }
    });

    $('btnFillTemplate').addEventListener('click', function(){
      if (!templateReady) return;
      splitSheetGrid(DEFAULT_TEMPLATE, 4, 3).then(function(frames){
        var gid = nextSourceId();
        state.pool = frames.slice();
        state.poolSources = frames.map(function(){ return gid; });
        for (var i = 0; i < 12; i++) { state.rawFrames[i] = frames[i]; state.scaleApprovals[i] = false; state.sources[i] = gid; state.edited[i] = false; }
        renderPool();
        return runPostProcess();
      }).then(function(){
        renderGrid(); saveLocal();
        toast('已用内置模板填充');
      });
    });

    $('btnPoolAutoRow').addEventListener('click', function(){
      var dir = Number($('poolTargetDir').value) || 0;
      for (var c = 0; c < 3 && c < state.pool.length; c++) {
        state.rawFrames[dir * 3 + c] = state.pool[c];
        state.scaleApprovals[dir * 3 + c] = false;
        state.sources[dir * 3 + c] = state.poolSources[c] || nextSourceId();
        state.edited[dir * 3 + c] = false;
      }
      runPostProcess().then(function(){ renderGrid(); saveLocal(); toast('已填入 ' + DIRS[dir] + ' 行'); });
    });
    $('btnPoolAutoAll').addEventListener('click', function(){
      for (var i = 0; i < 12 && i < state.pool.length; i++) {
        state.rawFrames[i] = state.pool[i];
        state.scaleApprovals[i] = false;
        state.sources[i] = (state.poolSources[i] || nextSourceId()) + '_r' + Math.floor(i / 3);
        state.edited[i] = false;
      }
      runPostProcess().then(function(){ renderGrid(); saveLocal(); toast('已按顺序填入 3×4'); });
    });
    $('btnPoolClear').addEventListener('click', function(){
      state.pool = []; state.poolSources = []; selectedPoolIndex = -1; renderPool(); renderGrid();
    });

    $('btnReprocessAll').addEventListener('click', function(){
      syncStateFromInputs();
      if (!state.rawFrames.some(Boolean)) { toast('当前没有可处理的原始帧'); return; }
      runPostProcess().then(function(res){
        renderGrid(); saveLocal();
        var skipMsg = res && res.skippedEdited ? '（已保留 ' + res.skippedEdited + ' 帧手修内容）' : '';
        toast('已重新统一处理' + skipMsg);
      });
    });

    $('btnMirrorL2R').addEventListener('click', function(){ mirrorRow(1, 2); });
    $('btnMirrorR2L').addEventListener('click', function(){ mirrorRow(2, 1); });
    $('btnClearAll').addEventListener('click', function(){
      ++lockRefresh;
      state.frames = new Array(12).fill('');
      state.unlockedFrames = state.frames.slice();
      state.lockResults = new Array(12).fill(null);
      state.rawFrames = new Array(12).fill('');
      state.rawSheet = '';
      state.rawSheetCuts = null;
      state.rawSheetCells = null;
      state.sources = new Array(12).fill('');
      state.bodyCellHeights = {};
      state.edited = new Array(12).fill(false);
      state.overflow = [];
      state.scaleApprovals.fill(false);
      state.palette = null;
      lastNativeStats = null;
      window.__lastNativeStats = null;
      renderGrid(); saveLocal();
      toast('已清空 12 帧');
    });

    $('btnExport').addEventListener('click', exportSheetPng);
    $('btnExportFoot').addEventListener('click', exportSheetPng);
    $('btnSaveProject').addEventListener('click', exportProjectJson);
    $('btnLoadProject').addEventListener('click', function(){ $('fileProject').click(); });
    $('fileProject').addEventListener('change', function(){
      var f = this.files && this.files[0]; this.value = '';
      if (!f) return;
      f.text().then(function(txt){
        var d = JSON.parse(txt);
        if (!d || !Array.isArray(d.frames) || d.frames.length !== 12) throw new Error('无效工程文件');
        state.frames = d.frames;
        state.unlockedFrames = d.unlockedFrames || state.frames.slice();
        state.lockResults = new Array(12).fill(null);
        state.rawFrames = Array.isArray(d.rawFrames) && d.rawFrames.length === 12 ? d.rawFrames : d.frames.slice();
        state.rawSheet = '';
        state.rawSheetCuts = null;
        state.rawSheetCells = null;
        state.sources = Array.isArray(d.sources) && d.sources.length === 12 ? d.sources : state.rawFrames.map(function(_, idx){ return 'legacy_' + Math.floor(idx / 3); });
        state.bodyCellHeights = d.bodyCellHeights || {};
        state.edited = Array.isArray(d.edited) && d.edited.length === 12 ? d.edited.map(Boolean) : new Array(12).fill(false);
        state.overflow = d.overflow || [];
        state.scaleApprovals = d.scaleApprovals || new Array(12).fill(false);
        state.palette = d.palette || null;
        state.charRef = d.charRef || '';
        if ('baseBodyId' in d) state.baseBodyId = d.baseBodyId === null ? null : String(d.baseBodyId || '');
        if (typeof d.customBaseBody === 'string') state.customBaseBody = d.customBaseBody;
        state.itemRef = d.itemRef || '';
        state.charDesc = d.charDesc || '';
        state.styleDesc = d.styleDesc || state.styleDesc;
        state.aiModel = d.aiModel || API_SPEC.defaultModel;
        state.aiBgType = d.aiBgType || 'transparent';
        state.aiDir = typeof d.aiDir === 'number' ? d.aiDir : 0;
        state.seqDuration = d.seqDuration || 200;
        state.seqSize = d.seqSize || '1024x1024';
        state.seqQuality = d.seqQuality || 'low';
        state.mzPrefix = d.mzPrefix !== false;
        if (d.pp) state.pp = Object.assign(state.pp, d.pp);
        applyStateToInputs();
        return refreshBodyLocks().then(function(){
          renderGrid(); saveLocal(); toast('工程已导入');
        });
      }).catch(function(e){ toast('导入失败：' + e.message, 3600); });
    });

    $('previewDirs').addEventListener('click', function(e){
      var b = e.target.closest('.seg-btn'); if (!b) return;
      previewDir = Number(b.dataset.dir);
      document.querySelectorAll('#previewDirs .seg-btn').forEach(function(x){ x.classList.toggle('on', x === b); });
      drawPreview();
    });
    $('previewZooms').addEventListener('click', function(e){
      var b = e.target.closest('.seg-btn'); if (!b) return;
      previewZoom = Number(b.dataset.zoom);
      document.querySelectorAll('#previewZooms .seg-btn').forEach(function(x){ x.classList.toggle('on', x === b); });
      drawPreview();
    });
    $('btnPlay').addEventListener('click', function(){
      if (previewTimer) stopPreview(); else startPreview();
    });
    $('btnStep').addEventListener('click', function(){
      stopPreview();
      previewStepPos = (previewStepPos + 1) % MZ_PLAY_SEQ.length;
      drawPreview();
    });
    $('previewSpeed').addEventListener('change', function(){
      if (previewTimer) startPreview();
    });

    $('btnConfig').addEventListener('click', function(){
      $('cfgBase').value = config.baseUrl;
      $('cfgKey').value = config.apiKey;
      $('cfgModel').value = config.model;
      $('cfgEditsPath').value = config.editsPath;
      $('cfgGenPath').value = config.generationsPath;
      $('cfgTimeout').value = String(config.timeout);
      $('cfgTestResult').textContent = '';
      $('configDialog').showModal();
    });
    $('btnSaveConfig').addEventListener('click', function(){
      config.baseUrl = $('cfgBase').value.trim() || API_SPEC.defaultBaseUrl;
      config.apiKey = $('cfgKey').value.trim();
      config.model = $('cfgModel').value.trim() || API_SPEC.defaultModel;
      config.editsPath = $('cfgEditsPath').value.trim() || API_SPEC.editsPath;
      config.generationsPath = $('cfgGenPath').value.trim() || API_SPEC.generationsPath;
      config.timeout = Number($('cfgTimeout').value) || 300;
      saveConfig();
      $('configDialog').close();
      toast('配置已保存');
    });
    $('btnTestApi').addEventListener('click', function(){
      var base = normalizeBase($('cfgBase').value);
      if (!base) { $('cfgTestResult').textContent = '请填写 Base URL'; return; }
      $('cfgTestResult').textContent = '测试中…';
      var url = buildEndpoint(base, '/models');
      var headers = {};
      var key = $('cfgKey').value.trim();
      if (key) headers.Authorization = 'Bearer ' + key;
      fetch(url, { headers: headers }).then(function(res){
        return res.text().then(function(txt){
          if (res.ok) $('cfgTestResult').textContent = '连接成功 (HTTP ' + res.status + ')';
          else $('cfgTestResult').textContent = parseApiError(res, txt);
        });
      }).catch(function(e){ $('cfgTestResult').textContent = '连接失败：' + e.message; });
    });

    document.querySelectorAll('[data-close]').forEach(function(b){
      b.addEventListener('click', function(){ $(this.dataset.close).close(); });
    });

    document.querySelectorAll('[data-tool]').forEach(function(b){
      b.addEventListener('click', function(){ setEditTool(this.dataset.tool); });
    });
    $('editBrush').addEventListener('input', function(){ $('brushLabel').textContent = this.value + ' px'; });
    $('btnUndo').addEventListener('click', function(){
      var d = editUndo.pop(); if (!d) return;
      $('editCanvas').getContext('2d').putImageData(d, 0, 0);
    });
    $('btnNudgeLeft').addEventListener('click', function(){ nudgeEditor(-1, 0); });
    $('btnNudgeRight').addEventListener('click', function(){ nudgeEditor(1, 0); });
    $('btnNudgeUp').addEventListener('click', function(){ nudgeEditor(0, -1); });
    $('btnNudgeDown').addEventListener('click', function(){ nudgeEditor(0, 1); });
    $('btnFlipFrame').addEventListener('click', function(){
      var c = $('editCanvas'), ctx = c.getContext('2d');
      pushEditUndo();
      editModified = true;
      var tmp = document.createElement('canvas'); tmp.width = c.width; tmp.height = c.height;
      tmp.getContext('2d').drawImage(c, 0, 0);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.save(); ctx.translate(c.width, 0); ctx.scale(-1, 1); ctx.drawImage(tmp, 0, 0); ctx.restore();
    });
    $('btnClearFrame').addEventListener('click', function(){
      var c = $('editCanvas'); pushEditUndo();
      editModified = true;
      c.getContext('2d').clearRect(0, 0, c.width, c.height);
    });
    $('btnApplyTemplate').addEventListener('click', function(){
      if (!templateReady) return;
      var c = $('editCanvas'), ctx = c.getContext('2d');
      pushEditUndo();
      editModified = true;
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.drawImage(templateFrameCanvas(editIndex, c.width), 0, 0);
    });
    $('btnStampItem').addEventListener('click', function(){
      editStamp = !editStamp;
      this.classList.toggle('on', editStamp);
      if (editStamp) document.querySelectorAll('[data-tool]').forEach(function(b){ b.classList.remove('on'); });
    });
    $('btnImportFrame').addEventListener('click', function(){ $('fileFrame').click(); });
    $('fileFrame').addEventListener('change', function(){
      var f = this.files && this.files[0]; this.value = '';
      if (!f) return;
      readFileAsDataUrl(f).then(function(url){
        state.rawFrames[editIndex] = url;
        state.scaleApprovals[editIndex] = false;
        state.sources[editIndex] = nextSourceId();
        state.edited[editIndex] = false;
        editModified = false;
        $('btnReprocessFrame').disabled = false;
        return runPostProcess([editIndex]);
      }).then(function(){
        renderGrid(); saveLocal();
        if (!state.frames[editIndex] || state.overflow.indexOf(editIndex) >= 0) return;
        return loadImg(state.frames[editIndex]).then(function(im){
          var c = $('editCanvas'), ctx = c.getContext('2d');
          pushEditUndo();
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.drawImage(im, 0, 0, c.width, c.height);
        });
      });
    });
    $('btnReprocessFrame').addEventListener('click', function(){
      if (!state.rawFrames[editIndex]) return;
      syncStateFromInputs();
      state.edited[editIndex] = false;
      editModified = false;
      runPostProcess([editIndex]).then(function(){
        renderGrid(); saveLocal();
        if (!state.frames[editIndex] || state.overflow.indexOf(editIndex) >= 0) return;
        return loadImg(state.frames[editIndex]).then(function(im){
          var c = $('editCanvas'), ctx = c.getContext('2d');
          pushEditUndo();
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.drawImage(im, 0, 0, c.width, c.height);
          toast('已重跑当前帧后处理');
        });
      });
    });
    $('btnClearMask').addEventListener('click', clearEditMask);
    $('btnStopRedraw').addEventListener('click', function(){ if (abortCtrl) abortCtrl.abort(); });
    $('btnRedrawFrame').addEventListener('click', function(){
      var useMask = editMaskHas && !isEditorOverflow();
      var maskCopy = null;
      var baseUrl = '';
      if (useMask) {
        var mc = $('editMaskCanvas');
        maskCopy = document.createElement('canvas');
        maskCopy.width = mc.width; maskCopy.height = mc.height;
        maskCopy.getContext('2d').drawImage(mc, 0, 0);
        baseUrl = $('editCanvas').toDataURL('image/png');
      }
      redrawSingleFrame(editIndex, {
        localMaskCanvas: maskCopy,
        baseFrameDataUrl: baseUrl,
        note: $('redrawNote').value.trim(),
        fromEditor: true
      });
    });

    $('btnSaveFrame').addEventListener('click', function(){
      if (state.overflow.indexOf(editIndex) >= 0) { $('editorDialog').close(); return; }
      binaryAlpha($('editCanvas'), state.pp.alphaThresh);
      state.frames[editIndex] = $('editCanvas').toDataURL('image/png');
      if (editModified || editUndo.length > 0) {
        state.edited[editIndex] = true;
        state.unlockedFrames[editIndex] = state.frames[editIndex];
        state.lockResults[editIndex] = null;
      }
      renderGrid(); saveLocal();
      $('editorDialog').close();
      toast('第 ' + (editIndex + 1) + ' 帧已保存');
    });

    var ec = $('editCanvas');
    ec.addEventListener('pointerdown', function(e){
      if (isEditorOverflow()) return;
      e.preventDefault();
      var p = editPoint(e);
      if (editStamp) { stampItemAt(p); return; }
      if (editTool === 'eyedrop') { pickColorAt(p); return; }
      if (editTool !== 'mask' && editTool !== 'maskEraser') {
        pushEditUndo();
        editModified = true;
      }
      editDrawing = true;
      editLast = p;
      drawAt(p);
      ec.setPointerCapture(e.pointerId);
    });
    ec.addEventListener('pointermove', function(e){
      if (!editDrawing) return;
      e.preventDefault();
      var p = editPoint(e);
      drawLine(editLast || p, p);
      editLast = p;
    });
    ec.addEventListener('pointerup', function(e){
      if (editDrawing && (editTool === 'mask' || editTool === 'maskEraser')) syncEditMaskState();
      editDrawing = false; editLast = null;
      try { ec.releasePointerCapture(e.pointerId); } catch(err) {}
    });
    ec.addEventListener('pointercancel', function(){
      if (editDrawing && (editTool === 'mask' || editTool === 'maskEraser')) syncEditMaskState();
      editDrawing = false; editLast = null;
    });
  }

  function boot(){
    loadLocal();
    loadConfig();
    applyStateToInputs();
    bindEvents();
    templateImg.onload = function(){ templateReady = true; renderGrid(); };
    templateImg.src = DEFAULT_TEMPLATE;
    renderVariants();
    renderPool();
    renderGrid();
    if (state.frames.some(Boolean)) refreshBodyLocks().then(renderGrid);
    startPreview();
  }

  boot();

  /*
   * 参考实现与开源许可证声明（仅参考 MIT / Apache-2.0 算法实现）：
   * - DFT 相位相干度像素格检测、双阶段 OKLab 调色板与假棋盘格泛洪思路参考自：
   *   salvimateus/pixel-unslop (MIT License) & m4bwav/pixelwright (MIT License)
   * - 弹性边界步进吸附思路参考自：
   *   Hugo-Dz/spritefusion-pixel-snapper (MIT License)
   * - 色键去溢色、领口线以下封闭口袋重开与 2px 边缘去染参考自：
   *   isabellagreco1997/ai-sprite-animator (MIT License) & m4bwav/pixelwright (MIT License)
   * - 白底泛洪中性度守卫参考自：
   *   JhonZacipa/SpriteGenIA (Apache License 2.0)
   * - 罕见特征色保护思路参考自：
   *   m4bwav/pixelwright (MIT License) & CombinEC-R/Pixel-Perfect-Aligner (MIT License)
   * - 平滑列密度极小值拆帧兜底参考自：
   *   pickbitsai/sprite-generator (MIT License)
   */
})();
</script>
</body>
</html>
